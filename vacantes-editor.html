<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Talent Scan — Crear o editar vacante</title>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #F5F7F8; }
  #root { min-height: 100vh; }

  .ts-root {
    --ts-bg: #F7F6FB; --ts-surface: #FFFFFF; --ts-ink: #1A1625; --ts-muted: #6B6478;
    --ts-border: #E7E3F0; --ts-primary: #6D28D9; --ts-primary-soft: #F0EBFC;
    background: var(--ts-bg); color: var(--ts-ink); min-height: 100%;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 32px 24px 80px;
  }
  .ts-shell { max-width: 960px; margin: 0 auto; }

  .ts-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 8px; }
  .ts-brand-icon { width: 40px; height: 40px; border-radius: 11px; flex-shrink: 0; background: var(--ts-primary); color: white; display: flex; align-items: center; justify-content: center; }
  .ts-brand-name { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
  .ts-brand-tag { font-size: 12.5px; color: var(--ts-muted); }
  .ts-warning-banner { margin: 16px 0 24px; padding: 12px 16px; border-radius: 10px; font-size: 12.5px; background: #FFEDE0; color: #9A3412; line-height: 1.5; }

  .ts-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 22px; align-items: center; }
  .ts-btn { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; padding: 10px 16px; border-radius: 10px; border: none; cursor: pointer; }
  .ts-btn--primary { background: var(--ts-primary); color: white; }
  .ts-btn--primary:hover { opacity: 0.9; }
  .ts-btn--ghost { background: var(--ts-surface); color: var(--ts-ink); border: 1px solid var(--ts-border); }
  .ts-btn--ghost:hover { background: var(--ts-primary-soft); }
  .ts-btn--danger { background: #FBE9E7; color: #B3261E; }
  .ts-btn--danger:hover { opacity: 0.85; }
  .ts-file-label { display: inline-flex; align-items: center; gap: 7px; font-size: 13.5px; font-weight: 700; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--ts-border); background: var(--ts-surface); cursor: pointer; }
  .ts-file-label:hover { background: var(--ts-primary-soft); }

  .ts-vacante-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; align-items: center; }
  .ts-vacante-chip { font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 10px; border: 1.5px solid var(--ts-border); background: var(--ts-surface); color: var(--ts-muted); cursor: pointer; }
  .ts-vacante-chip.is-active { border-color: var(--ts-primary); background: var(--ts-primary-soft); color: var(--ts-primary); }

  .ts-card { background: var(--ts-surface); border: 1px solid var(--ts-border); border-radius: 16px; padding: 20px 22px; }
  .ts-top-fields { display: grid; grid-template-columns: 2fr 3fr; gap: 14px; margin-bottom: 8px; }
  @media (max-width: 720px) { .ts-top-fields { grid-template-columns: 1fr; } }
  .ts-field-group { display: flex; flex-direction: column; gap: 4px; }
  .ts-field-label-sm { font-size: 10.5px; color: var(--ts-muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .ts-field-input { border: 1px solid var(--ts-border); border-radius: 8px; padding: 8px 10px; font-size: 13.5px; font-family: inherit; width: 100%; background: var(--ts-surface); color: var(--ts-ink); }
  .ts-field-input:focus { outline: none; border-color: var(--ts-primary); }

  .ts-editor-panel { margin-top: 18px; display: flex; flex-direction: column; gap: 14px; }
  .ts-editor-section { background: var(--ts-surface); border: 1px solid var(--ts-border); border-radius: 14px; padding: 16px 20px; }
  .ts-editor-section--descarte { border-color: #F0D9D6; }
  .ts-editor-section-title { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ts-muted); margin-bottom: 6px; }
  .ts-section-help { font-size: 12px; color: var(--ts-muted); margin: 0 0 14px; line-height: 1.5; }
  .ts-presupuesto-row { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; padding-bottom: 14px; border-bottom: 1px solid var(--ts-border); }
  .ts-presupuesto-row input { width: 80px; }
  .ts-row-flex { display: flex; gap: 10px; align-items: flex-end; padding: 10px 0; border-bottom: 1px solid var(--ts-border); flex-wrap: wrap; }
  .ts-row-flex:last-of-type { border-bottom: none; }
  .ts-add-btn { font-size: 12.5px; font-weight: 700; color: var(--ts-primary); background: var(--ts-primary-soft); border: none; border-radius: 8px; padding: 8px 14px; cursor: pointer; margin-top: 10px; }
  .ts-add-btn:hover { opacity: 0.85; }
  .ts-remove-btn-row { border: none; background: transparent; color: #B3261E; cursor: pointer; padding: 7px; border-radius: 6px; flex-shrink: 0; }
  .ts-remove-btn-row:hover { background: #FBE9E7; }
  .ts-muted-sm { font-size: 12px; color: var(--ts-muted); }

  .ts-json-toggle { margin-top: 22px; font-size: 12.5px; font-weight: 700; color: var(--ts-muted); background: none; border: none; cursor: pointer; text-decoration: underline; padding: 0; }
  .ts-json-preview { margin-top: 10px; background: #0F1A17; color: #B9E8D6; border-radius: 12px; padding: 16px; font-size: 11.5px; font-family: ui-monospace, "SF Mono", monospace; overflow: auto; max-height: 360px; white-space: pre; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
/**
 * ============================================================================
 * TALENT SCAN — EDITOR DE VACANTES (borrador, no publica directo)
 * ============================================================================
 * v1.0 — Arquitectura de puntaje:
 *
 * - REQUISITOS: no dan puntos, solo alertan si faltan (formación, ubicación,
 *   portafolio, licencias, etc.). Se agregan/quitan libremente.
 * - HABILIDADES INDISPENSABLES: definen el % de compatibilidad. Se les da un
 *   presupuesto total a la CATEGORÍA (ej. 100) y se reparte solo entre las
 *   que agregues — nunca hay que tocar números al agregar/quitar una.
 * - DESEABLES: presupuesto de bono (ej. 20) que se suma encima si el
 *   candidato las tiene, nunca resta si no las tiene.
 * - CRITERIOS DE DESCARTE: distinto a "requisito" — aquí se detectó algo
 *   que SÍ contradice el puesto (becario, creador de redes, etc.) y
 *   descarta directo, sin excepción.
 * - Sin salario en ningún lado (vacantes.json es público).
 * ============================================================================
 */

const { useState, useEffect } = React;

function Icon({ name, size = 16, style }) {
  const common = { width: size, height: size, viewBox: "0 0 24 24", fill: "none", stroke: "currentColor", strokeWidth: 2, strokeLinecap: "round", strokeLinejoin: "round", style };
  switch (name) {
    case "scan": return <svg {...common}><path d="M4 7V5a1 1 0 0 1 1-1h2" /><path d="M17 4h2a1 1 0 0 1 1 1v2" /><path d="M20 17v2a1 1 0 0 1-1 1h-2" /><path d="M7 20H5a1 1 0 0 1-1-1v-2" /><line x1="4" y1="12" x2="20" y2="12" /></svg>;
    case "x": return <svg {...common}><line x1="5" y1="5" x2="19" y2="19" /><line x1="19" y1="5" x2="5" y2="19" /></svg>;
    case "shield": return <svg {...common}><path d="M12 2l8 3v6c0 5-3.5 8.5-8 11-4.5-2.5-8-6-8-11V5z" /><line x1="12" y1="9" x2="12" y2="13" /><circle cx="12" cy="16.3" r="0.6" fill="currentColor" stroke="none" /></svg>;
    case "sparkles": return <svg {...common}><path d="M12 3l1.5 4.5L18 9l-4.5 1.5L12 15l-1.5-4.5L6 9l4.5-1.5z" /><path d="M19 15l0.7 2 2 0.7-2 0.7-0.7 2-0.7-2-2-0.7 2-0.7z" /></svg>;
    case "ban": return <svg {...common}><circle cx="12" cy="12" r="9" /><line x1="6" y1="18" x2="18" y2="6" /></svg>;
    case "download": return <svg {...common}><path d="M12 4v12" /><path d="M6 12l6 6 6-6" /><path d="M4 20h16" /></svg>;
    case "upload": return <svg {...common}><path d="M12 16V4" /><path d="M6 10l6-6 6 6" /><path d="M4 20h16" /></svg>;
    case "plus": return <svg {...common}><line x1="12" y1="5" x2="12" y2="19" /><line x1="5" y1="12" x2="19" y2="12" /></svg>;
    default: return null;
  }
}

const UBICACION_KEYWORDS = ["ciudad de mexico", "cdmx", "estado de mexico", "edomex", "zona metropolitana", "zona conurbada", "naucalpan", "ecatepec", "nezahualcoyotl", "tlalnepantla", "atizapan", "cuautitlan", "huixquilucan", "chalco", "chimalhuacan", "coacalco", "tultitlan", "los reyes la paz"];

const VACANTES_POR_DEFECTO = {

      { id: "redaccion", label: "Redacción", tipo: "keyword", categoria: "habilidad_indispensable", keywords: ["redaccion"] },
      { id: "edicion", label: "Edición", tipo: "keyword", categoria: "habilidad_indispensable", keywords: ["edicion"] },
      { id: "breaking", label: "Breaking News", tipo: "keyword", categoria: "habilidad_indispensable", keywords: ["breaking news", "ultima hora", "noticia de ultimo momento", "noticias de ultimo momento"] },
      { id: "monitoreo", label: "Monitoreo de información", tipo: "keyword", categoria: "habilidad_indispensable", keywords: ["monitoreo de informacion", "monitoreo de medios", "monitoreo"] },
      { id: "equipo", label: "Trabajo en equipo", tipo: "keyword", categoria: "habilidad_indispensable", keywords: ["trabajo en equipo", "trabajo colaborativo"] },
      { id: "ingles", label: "Inglés", tipo: "keyword", categoria: "habilidad_deseable", keywords: ["ingles"] },

      { id: "creadorRedes", label: "Creador de contenido para redes", tipo: "keyword", categoria: "descarte", soloDescarte: true, keywords: ["tiktoker", "tik toker", "youtuber", "content creator", "creador de contenido", "influencer"], descarteSi: "cumple", descarteMensaje: "Criterio de descarte: perfil orientado a creación de contenido para redes (TikTok/YouTube)." },
      { id: "brandedContent", label: "Branded content", tipo: "keyword", categoria: "descarte", soloDescarte: true, keywords: ["branded content", "contenido patrocinado", "publirreportaje", "contenido publicitario"], descarteSi: "cumple", descarteMensaje: "Criterio de descarte: experiencia en branded content / contenido publicitario." },
      { id: "medioPequeno", label: "Medio sin alcance nacional", tipo: "keyword", categoria: "descarte", soloDescarte: true, keywords: ["pagina de facebook", "canal de youtube", "periodico local", "periodico estatal", "medio estatal"], descarteSi: "cumple", anularSiCumpleId: "medios", descarteMensaje: "Criterio de descarte: experiencia limitada a medios estatales pequeños, Facebook o YouTube sin alcance nacional." },
    ],
  },
  disenador_digital: {
    id: "disenador_digital", titulo: "Diseñador Digital", resumenCorto: "Diseño gráfico y digital para plataformas y contenido de marca.",

      { id: "formacion", label: "Formación académica", tipo: "keyword", categoria: "requisito", keywords: ["diseno grafico", "diseno digital", "diseno multimedia"], keywordsParcial: ["diseno"] },
      { id: "ubicacion", label: "Ubicación (CDMX / zona conurbada)", tipo: "keyword", categoria: "requisito", keywords: UBICACION_KEYWORDS },
      { id: "portafolio", label: "Liga a portafolio", tipo: "url", categoria: "requisito", keywords: ["portafolio", "portfolio", "behance", "dribbble"] },
      { id: "experiencia", label: "Experiencia en diseño digital", tipo: "anios", categoria: "requisito", anioMin: 1, anioMax: 3 },
      { id: "illustrator", label: "Adobe Illustrator", tipo: "keyword", categoria: "habilidad_indispensable", keywords: ["illustrator"] },
      { id: "photoshop", label: "Adobe Photoshop", tipo: "keyword", categoria: "habilidad_indispensable", keywords: ["photoshop"] },
      { id: "figma", label: "Figma", tipo: "keyword", categoria: "habilidad_indispensable", keywords: ["figma"] },
      { id: "disenoRedes", label: "Diseño para redes sociales", tipo: "keyword", categoria: "habilidad_indispensable", keywords: ["diseno para redes sociales", "contenido para redes sociales"] },
      { id: "creatividad", label: "Creatividad", tipo: "keyword", categoria: "habilidad_indispensable", keywords: ["creatividad", "creativo"] },
      { id: "atencionDetalle", label: "Atención al detalle", tipo: "keyword", categoria: "habilidad_indispensable", keywords: ["atencion al detalle", "atencion a detalle"] },
      { id: "trabajoEquipo", label: "Trabajo en equipo", tipo: "keyword", categoria: "feature", keywords: ["trabajo en equipo", "trabajo colaborativo"] },
      { id: "organizacion", label: "Organización", tipo: "keyword", categoria: "feature", keywords: ["organizacion", "organizado"] },
      { id: "comunicacionEfectiva", label: "Comunicación efectiva", tipo: "keyword", categoria: "feature", keywords: ["comunicacion efectiva", "buena comunicacion"] },
      { id: "html", label: "HTML", tipo: "keyword", categoria: "habilidad_deseable", keywords: ["html"] },
      { id: "css", label: "CSS", tipo: "keyword", categoria: "habilidad_deseable", keywords: ["css"] },
      { id: "disenoWeb", label: "Diseño web", tipo: "keyword", categoria: "habilidad_deseable", keywords: ["diseno web"] },
      { id: "disenoResponsivo", label: "Diseño responsivo", tipo: "keyword", categoria: "habilidad_deseable", keywords: ["diseno responsivo", "responsive"] },
      { id: "uxui", label: "UX/UI", tipo: "keyword", categoria: "habilidad_deseable", keywords: ["ux/ui", "ux ui", "experiencia de usuario", "interfaz de usuario"] },
      { id: "edicionVideo", label: "Edición de video", tipo: "keyword", categoria: "habilidad_deseable", keywords: ["edicion de video", "edicion de videos"] },
      { id: "motionGraphics", label: "Motion Graphics", tipo: "keyword", categoria: "habilidad_deseable", keywords: ["motion graphics", "motion graphic"] },
      { id: "areaNoRelacionada", label: "Área no relacionada con diseño", tipo: "areaNoRelacionada", categoria: "descarte", soloDescarte: true, keywords: ["administracion", "ventas", "logistica", "atencion a clientes", "call center", "recursos humanos", "contabilidad"], keywordsExcluyentes: ["diseno grafico", "diseno digital", "illustrator", "photoshop", "figma", "diseno web", "ux/ui", "ui/ux"], descarteMensaje: "Criterio de descarte: la experiencia detectada parece estar exclusivamente en áreas no relacionadas con diseño (administración, ventas, logística, etc.)." },

/* ----------------------------------------------------------------------- */
/* FILAS DE EDICIÓN                                                        */
/* ----------------------------------------------------------------------- */

function FilaSimple({ criterio, onUpdate, onRemove, placeholderNombre }) {
  const [label, setLabel] = useState(criterio.label);
  const [keywords, setKeywords] = useState((criterio.keywords || []).join(", "));

  return (
    <div className="ts-row-flex">
      <div className="ts-field-group" style={{ flex: "1 1 180px" }}>
        <span className="ts-field-label-sm">Nombre</span>
        <input className="ts-field-input" placeholder={placeholderNombre} value={label} onChange={(e) => { setLabel(e.target.value); onUpdate({ label: e.target.value }); }} />
      </div>
      <div className="ts-field-group" style={{ flex: "2 1 260px" }}>
        <span className="ts-field-label-sm">Palabras clave (separadas por coma)</span>
        <input className="ts-field-input" value={keywords} onChange={(e) => { setKeywords(e.target.value); onUpdate({ keywords: e.target.value.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean) }); }} />
      </div>
      <button className="ts-remove-btn-row" onClick={onRemove} aria-label="Eliminar"><Icon name="x" size={14} /></button>
    </div>
  );
}

function FilaDescarte({ criterio, onUpdate, onRemove }) {
  const [label, setLabel] = useState(criterio.label);
  const [keywords, setKeywords] = useState((criterio.keywords || []).join(", "));
  const [mensaje, setMensaje] = useState(criterio.descarteMensaje || "");
  const tieneExcepciones = criterio.keywordsExcluyentes !== undefined;
  const [excepciones, setExcepciones] = useState((criterio.keywordsExcluyentes || []).join(", "));

  return (
    <div style={{ paddingBottom: 14, marginBottom: 14, borderBottom: "1px solid var(--ts-border)" }}>
      <div className="ts-row-flex" style={{ borderBottom: "none", padding: 0 }}>
        <div className="ts-field-group" style={{ flex: "1 1 200px" }}>
          <span className="ts-field-label-sm">Nombre del criterio</span>
          <input className="ts-field-input" value={label} onChange={(e) => { setLabel(e.target.value); onUpdate({ label: e.target.value }); }} />
        </div>
        <div className="ts-field-group" style={{ flex: "2 1 220px" }}>
          <span className="ts-field-label-sm">Palabras clave que disparan el descarte</span>
          <input className="ts-field-input" value={keywords} onChange={(e) => { setKeywords(e.target.value); onUpdate({ keywords: e.target.value.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean) }); }} />
        </div>
        <button className="ts-remove-btn-row" onClick={onRemove} aria-label="Eliminar criterio"><Icon name="x" size={14} /></button>
      </div>
      <div className="ts-field-group" style={{ marginTop: 8 }}>
        <span className="ts-field-label-sm">Mensaje que se muestra como riesgo</span>
        <input className="ts-field-input" value={mensaje} onChange={(e) => { setMensaje(e.target.value); onUpdate({ descarteMensaje: e.target.value }); }} />
      </div>
      {tieneExcepciones && (
        <div className="ts-field-group" style={{ marginTop: 8 }}>
          <span className="ts-field-label-sm">No descartar si también menciona (excepciones)</span>
          <input className="ts-field-input" value={excepciones} onChange={(e) => { setExcepciones(e.target.value); onUpdate({ keywordsExcluyentes: e.target.value.split(",").map((s) => s.trim().toLowerCase()).filter(Boolean) }); }} />
        </div>
      )}
    </div>
  );
}

function FilaExperiencia({ criterio, onUpdate }) {
  const [anioMin, setAnioMin] = useState(criterio.anioMin);
  const [anioMax, setAnioMax] = useState(criterio.anioMax);
  return (
    <div className="ts-row-flex">
      <div className="ts-field-group" style={{ width: 110 }}>
        <span className="ts-field-label-sm">Años mínimo</span>
        <input className="ts-field-input" type="number" value={anioMin} onChange={(e) => { setAnioMin(e.target.value); onUpdate({ anioMin: Number(e.target.value) || 0 }); }} />
      </div>
      <div className="ts-field-group" style={{ width: 130 }}>
        <span className="ts-field-label-sm">Años máximo (ideal)</span>
        <input className="ts-field-input" type="number" value={anioMax} onChange={(e) => { setAnioMax(e.target.value); onUpdate({ anioMax: Number(e.target.value) || 0 }); }} />
      </div>
      <p className="ts-muted-sm" style={{ alignSelf: "center", margin: 0 }}>Cuenta como una habilidad indispensable más — comparte el presupuesto de esa categoría.</p>
    </div>
  );
}

function SeccionRequisitos({ criterios, onUpdate, onRemove, onAdd }) {
  return (
    <div className="ts-editor-section">
      <div className="ts-editor-section-title"><Icon name="shield" size={14} /> Requisitos</div>
      <p className="ts-section-help">No dan puntos. Si falta uno, se marca como riesgo/verificar — nunca descartan solos si el resto del perfil (habilidades) es fuerte.</p>
      {criterios.length === 0 && <p className="ts-muted-sm">Sin requisitos configurados.</p>}
      {criterios.map((c) => (
        c.tipo === "anios"
          ? <FilaExperiencia key={c.id} criterio={c} onUpdate={(patch) => onUpdate(c.id, patch)} />
          : <FilaSimple key={c.id} criterio={c} onUpdate={(patch) => onUpdate(c.id, patch)} onRemove={() => onRemove(c.id)} placeholderNombre="ej. Licencia de conducir" />
      ))}
      <button className="ts-add-btn" onClick={onAdd}>+ Agregar requisito</button>
    </div>
  );
}

function SeccionHabilidades({ titulo, ayuda, criterios, presupuesto, onPresupuestoChange, onUpdate, onRemove, onAdd }) {
  const [presupuestoLocal, setPresupuestoLocal] = useState(presupuesto);
  const shareAprox = criterios.length > 0 ? (presupuestoLocal / criterios.length).toFixed(1) : 0;

  return (
    <div className="ts-editor-section">
      <div className="ts-editor-section-title"><Icon name="sparkles" size={14} /> {titulo}</div>
      <p className="ts-section-help">{ayuda}</p>
      <div className="ts-presupuesto-row">
        <span className="ts-field-label-sm">Presupuesto total de la categoría</span>
        <input className="ts-field-input" type="number" value={presupuestoLocal} onChange={(e) => { setPresupuestoLocal(Number(e.target.value) || 0); onPresupuestoChange(Number(e.target.value) || 0); }} />
        {criterios.length > 0 && <span className="ts-muted-sm">≈ {shareAprox} pts. cada una ({criterios.length} habilidad{criterios.length === 1 ? "" : "es"})</span>}
      </div>
      {criterios.length === 0 && <p className="ts-muted-sm">Sin habilidades en esta sección.</p>}
      {criterios.map((c) => (
        c.tipo === "anios"
          ? <FilaExperiencia key={c.id} criterio={c} onUpdate={(patch) => onUpdate(c.id, patch)} />
          : <FilaSimple key={c.id} criterio={c} onUpdate={(patch) => onUpdate(c.id, patch)} onRemove={() => onRemove(c.id)} placeholderNombre="ej. Excel avanzado" />
      ))}
      <button className="ts-add-btn" onClick={onAdd}>+ Agregar habilidad</button>
    </div>
  );
}

function SeccionFeatures({ criterios, onUpdate, onRemove, onAdd }) {
  return (
    <div className="ts-editor-section">
      <div className="ts-editor-section-title"><Icon name="sparkles" size={14} /> Características</div>
      <p className="ts-section-help">Se detectan y se muestran si aparecen en el CV, pero NO afectan el puntaje en absoluto — ni suman ni restan. Úsalas para cosas que quieres ver, no que quieres exigir.</p>
      {criterios.length === 0 && <p className="ts-muted-sm">Sin características configuradas.</p>}
      {criterios.map((c) => <FilaSimple key={c.id} criterio={c} onUpdate={(patch) => onUpdate(c.id, patch)} onRemove={() => onRemove(c.id)} placeholderNombre="ej. Maneja Adobe Premiere" />)}
      <button className="ts-add-btn" onClick={onAdd}>+ Agregar característica</button>
    </div>
  );
}

function SeccionDescarte({ criterios, onUpdate, onRemove, onAdd }) {
  return (
    <div className="ts-editor-section ts-editor-section--descarte">
      <div className="ts-editor-section-title" style={{ color: "#B3261E" }}><Icon name="ban" size={14} /> Criterios de descarte</div>
      <p className="ts-section-help">Aquí SÍ se detectó algo que contradice el puesto (no que falte un dato) — esto descarta directo, sin excepción.</p>
      {criterios.length === 0 && <p className="ts-muted-sm">Sin criterios de descarte configurados.</p>}
      {criterios.map((c) => <FilaDescarte key={c.id} criterio={c} onUpdate={(patch) => onUpdate(c.id, patch)} onRemove={() => onRemove(c.id)} />)}
      <button className="ts-add-btn" onClick={onAdd}>+ Agregar criterio de descarte</button>
    </div>
  );
}

function SeccionRequisitosAdicionales({ items, onChange }) {
  const agregar = () => onChange([...items, ""]);
  const actualizar = (idx, val) => { const nueva = [...items]; nueva[idx] = val; onChange(nueva); };
  const eliminar = (idx) => onChange(items.filter((_, i) => i !== idx));
  return (
    <div className="ts-editor-section">
      <div className="ts-editor-section-title"><Icon name="shield" size={14} /> Requisitos adicionales (informativos)</div>
      <p className="ts-section-help">Solo texto de referencia (horario, disponibilidad, etc.) — no se evalúa automáticamente.</p>
      {items.length === 0 && <p className="ts-muted-sm">Sin requisitos adicionales.</p>}
      {items.map((item, i) => (
        <div className="ts-row-flex" key={i}>
          <input className="ts-field-input" value={item} onChange={(e) => actualizar(i, e.target.value)} style={{ flex: 1 }} />
          <button className="ts-remove-btn-row" onClick={() => eliminar(i)} aria-label="Eliminar"><Icon name="x" size={14} /></button>
        </div>
      ))}
      <button className="ts-add-btn" onClick={agregar}>+ Agregar requisito informativo</button>
    </div>
  );
}

/* ----------------------------------------------------------------------- */
/* APP                                                                     */
/* ----------------------------------------------------------------------- */

function slugify(texto) {
  return (texto || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "") || "vacante";
}
function fechaAmigable(fechaIso) {
  if (!fechaIso) return "sin fecha";
  const d = new Date(fechaIso);
  if (isNaN(d.getTime())) return fechaIso;
  const fecha = d.toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
  const hora = d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
  return `${fecha}, ${hora}`;
}

function EditorVacantes() {
  const [vacantes, setVacantes] = useState(VACANTES_POR_DEFECTO);
  const [vacanteActivaId, setVacanteActivaId] = useState("editor_web");
  const [mostrarJson, setMostrarJson] = useState(false);
  const [meta, setMeta] = useState({ version: 0, actualizado: null });
  const [cargado, setCargado] = useState(false);

  const vacante = vacantes[vacanteActivaId];
  const porCategoria = (cat) => (vacante ? vacante.criterios.filter((c) => c.categoria === cat) : []);

  const cargarArchivo = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        const { _meta, ...soloVacantes } = data;
        if (!soloVacantes || !Object.keys(soloVacantes).length) throw new Error("vacio");
        setVacantes(soloVacantes);
        setVacanteActivaId(Object.keys(soloVacantes)[0]);
        setMeta(_meta || { version: 0, actualizado: null });
        setCargado(true);
      } catch (err) {
        alert("No se pudo leer el archivo. Verifica que sea un vacantes.json válido.");
      }
    };
    reader.readAsText(file);
    e.target.value = "";
  };

  const empezarDesdeCero = () => setCargado(true);

  const descargar = () => {
    const ahora = new Date().toISOString();
    const nuevoMeta = { version: (meta.version || 0) + 1, actualizado: ahora };
    setMeta(nuevoMeta);
    const salida = { _meta: nuevoMeta, ...vacantes };
    const blob = new Blob([JSON.stringify(salida, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "vacantes.json";
    a.click();
    URL.revokeObjectURL(url);
  };

  const actualizarVacante = (patch) => setVacantes((prev) => ({ ...prev, [vacanteActivaId]: { ...prev[vacanteActivaId], ...patch } }));

  const actualizarCriterio = (criterioId, patch) => {
    setVacantes((prev) => ({
      ...prev,
      [vacanteActivaId]: { ...prev[vacanteActivaId], criterios: prev[vacanteActivaId].criterios.map((c) => (c.id === criterioId ? { ...c, ...patch } : c)) },
    }));
  };

  const agregarCriterio = (categoria) => {
    setVacantes((prev) => {
      const v = prev[vacanteActivaId];
      const nuevoId = `custom_${categoria}_${Date.now()}`;
      const nuevo = categoria === "descarte"
        ? { id: nuevoId, label: "Nuevo criterio de descarte", tipo: "keyword", categoria, soloDescarte: true, keywords: [], descarteSi: "cumple", descarteMensaje: "Criterio de descarte." }
        : { id: nuevoId, label: "Nuevo criterio", tipo: "keyword", categoria, keywords: [] };
      return { ...prev, [vacanteActivaId]: { ...v, criterios: [...v.criterios, nuevo] } };
    });
  };

  const eliminarCriterio = (criterioId) => {
    setVacantes((prev) => ({ ...prev, [vacanteActivaId]: { ...prev[vacanteActivaId], criterios: prev[vacanteActivaId].criterios.filter((c) => c.id !== criterioId) } }));
  };

  const actualizarRequisitosAdicionales = (lista) => {
    setVacantes((prev) => ({ ...prev, [vacanteActivaId]: { ...prev[vacanteActivaId], perfil: { ...prev[vacanteActivaId].perfil, requisitosAdicionales: lista } } }));
  };

  const nuevaVacante = () => {
    const titulo = prompt("Nombre de la nueva vacante:");
    if (!titulo) return;
    let id = slugify(titulo);
    let sufijo = 2;
    while (vacantes[id]) { id = `${slugify(titulo)}_${sufijo}`; sufijo++; }
    const nueva = {
      id, titulo, resumenCorto: "",
      presupuestoIndispensables: 100, presupuestoDeseables: 20,
      perfil: { requisitosAdicionales: [] },
      criterios: [],
    };
    setVacantes((prev) => ({ ...prev, [id]: nueva }));
    setVacanteActivaId(id);
  };

  const eliminarVacante = () => {
    if (!confirm(`¿Eliminar la vacante "${vacante.titulo}"? Esta acción no se puede deshacer (hasta que descargues de nuevo el JSON anterior).`)) return;
    setVacantes((prev) => { const nuevo = { ...prev }; delete nuevo[vacanteActivaId]; return nuevo; });
    const restantes = Object.keys(vacantes).filter((id) => id !== vacanteActivaId);
    setVacanteActivaId(restantes[0] || "");
  };

  if (!cargado) {
    return (
      <div className="ts-root">
        <div className="ts-shell" style={{ maxWidth: 620 }}>
          <div className="ts-brand">
            <div className="ts-brand-icon"><Icon name="scan" size={20} /></div>
            <div>
              <div className="ts-brand-name">Talent Scan — Crear o editar vacante</div>
              <div className="ts-brand-tag">Aquí armas la vacante; el cambio se sube por separado.</div>
            </div>
          </div>
          <div className="ts-card" style={{ marginTop: 22 }}>
            <div className="ts-card-title" style={{ marginBottom: 6, fontSize: 13, fontWeight: 700, color: "var(--ts-muted)", textTransform: "uppercase", letterSpacing: "0.03em" }}>Antes de editar</div>
            <p className="ts-body" style={{ fontSize: 14, lineHeight: 1.55 }}>
              Carga el <strong>vacantes.json</strong> que está subido actualmente en el sitio. Así editas sobre la
              versión más reciente y no corres el riesgo de sobreescribir cambios que alguien más ya haya hecho.
            </p>
            <label className="ts-file-label" style={{ marginTop: 16 }}>
              <Icon name="upload" size={15} /> Cargar vacantes.json actual
              <input type="file" accept="application/json" style={{ display: "none" }} onChange={cargarArchivo} />
            </label>
            <p className="ts-muted-sm" style={{ marginTop: 20 }}>
              ¿Primera vez y todavía no existe el archivo?{" "}
              <button className="ts-json-toggle" onClick={empezarDesdeCero}>Empezar desde cero</button>
            </p>
          </div>
        </div>
      </div>
    );
  }

  if (!vacante) {
    return (
      <div className="ts-root">
        <div className="ts-shell">
          <p className="ts-body">No hay vacantes. <button className="ts-add-btn" onClick={nuevaVacante}>+ Crear una</button></p>
        </div>
      </div>
    );
  }

  return (
    <div className="ts-root">
      <div className="ts-shell">
        <div className="ts-brand">
          <div className="ts-brand-icon"><Icon name="scan" size={20} /></div>
          <div>
            <div className="ts-brand-name">Talent Scan — Crear o editar vacante</div>
            <div className="ts-brand-tag">Aquí armas la vacante; el cambio se sube por separado.</div>
          </div>
        </div>

        <div className="ts-warning-banner">
          Estás editando sobre <strong>datos v{meta.version || 0}</strong> ({fechaAmigable(meta.actualizado)}). Al descargar,
          se guarda como <strong>v{(meta.version || 0) + 1}</strong> con la fecha de hoy. Comparte el archivo (Slack o
          correo) con la persona encargada de actualizar el sitio — esta página no publica nada directo a producción.
        </div>

        <div className="ts-toolbar">
          <label className="ts-file-label">
            <Icon name="upload" size={15} /> Cargar otro vacantes.json
            <input type="file" accept="application/json" style={{ display: "none" }} onChange={cargarArchivo} />
          </label>
          <button className="ts-btn ts-btn--primary" onClick={descargar}><Icon name="download" size={15} /> Descargar vacantes.json</button>
          <button className="ts-btn ts-btn--ghost" onClick={nuevaVacante}><Icon name="plus" size={15} /> Nueva vacante</button>
          <button className="ts-btn ts-btn--danger" onClick={eliminarVacante}><Icon name="x" size={15} /> Eliminar vacante actual</button>
        </div>

        <div className="ts-vacante-selector">
          {Object.values(vacantes).map((v) => (
            <button key={v.id} className={`ts-vacante-chip ${v.id === vacanteActivaId ? "is-active" : ""}`} onClick={() => setVacanteActivaId(v.id)}>{v.titulo}</button>
          ))}
        </div>

        <div className="ts-card">
          <div className="ts-top-fields">
            <div className="ts-field-group">
              <span className="ts-field-label-sm">Título de la vacante</span>
              <input className="ts-field-input" value={vacante.titulo} onChange={(e) => actualizarVacante({ titulo: e.target.value })} />
            </div>
            <div className="ts-field-group">
              <span className="ts-field-label-sm">Descripción corta</span>
              <input className="ts-field-input" value={vacante.resumenCorto} onChange={(e) => actualizarVacante({ resumenCorto: e.target.value })} />
            </div>
          </div>
          <p className="ts-muted-sm">id interno: {vacante.id}</p>
        </div>

        <div className="ts-editor-panel">
          <SeccionRequisitos
            criterios={porCategoria("requisito")}
            onUpdate={actualizarCriterio}
            onRemove={eliminarCriterio}
            onAdd={() => agregarCriterio("requisito")}
          />

          <SeccionHabilidades
            titulo="Habilidades indispensables"
            ayuda="Definen el % de compatibilidad. El presupuesto se reparte solo entre las que agregues — no hace falta rebalancear nada al agregar o quitar una."
            criterios={porCategoria("habilidad_indispensable")}
            presupuesto={vacante.presupuestoIndispensables}
            onPresupuestoChange={(v) => actualizarVacante({ presupuestoIndispensables: v })}
            onUpdate={actualizarCriterio}
            onRemove={eliminarCriterio}
            onAdd={() => agregarCriterio("habilidad_indispensable")}
          />

          <SeccionHabilidades
            titulo="Habilidades deseables"
            ayuda="Bono extra: se suma encima del % de indispensables si el candidato las tiene. Nunca restan si no las tiene."
            criterios={porCategoria("habilidad_deseable")}
            presupuesto={vacante.presupuestoDeseables}
            onPresupuestoChange={(v) => actualizarVacante({ presupuestoDeseables: v })}
            onUpdate={actualizarCriterio}
            onRemove={eliminarCriterio}
            onAdd={() => agregarCriterio("habilidad_deseable")}
          />

          <SeccionRequisitosAdicionales items={vacante.perfil.requisitosAdicionales} onChange={actualizarRequisitosAdicionales} />

          <SeccionFeatures
            criterios={porCategoria("feature")}
            onUpdate={actualizarCriterio}
            onRemove={eliminarCriterio}
            onAdd={() => agregarCriterio("feature")}
          />

          <SeccionDescarte criterios={porCategoria("descarte")} onUpdate={actualizarCriterio} onRemove={eliminarCriterio} onAdd={() => agregarCriterio("descarte")} />
        </div>

        <button className="ts-json-toggle" onClick={() => setMostrarJson((v) => !v)}>{mostrarJson ? "Ocultar" : "Ver"} JSON completo</button>
        {mostrarJson && <pre className="ts-json-preview">{JSON.stringify({ _meta: meta, ...vacantes }, null, 2)}</pre>}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<EditorVacantes />);
</script>
</body>
</html>
