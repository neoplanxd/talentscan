/* ----------------------------------------------------------------------- */
/* UTILIDADES DE TEXTO                                                     */
/* ----------------------------------------------------------------------- */

function normalizar(str) {
  return (str || "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g, "")
    .toLowerCase();
}

function matchAny(text, keywords) {
  return keywords.some((k) => text.includes(k));
}

function nombreDesdeArchivo(fileName) {
  const sinExtension = fileName.replace(/\.[^/.]+$/, "");
  const limpio = sinExtension.replace(/[_\-]+/g, " ").replace(/\s+/g, " ").trim();
  return limpio
    .split(" ")
    .map((w) => (w.length ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w))
    .join(" ");
}

function extraerNombreProbable(textoOriginal, fileName) {
  const primeraLinea = (textoOriginal || "").split("\n").map((l) => l.trim()).find((l) => l.length > 0);
  if (primeraLinea && primeraLinea.length >= 4 && primeraLinea.length <= 45) {
    const palabras = primeraLinea.split(/\s+/);
    const pareceNombre =
      palabras.length >= 2 &&
      palabras.length <= 4 &&
      /^[A-Za-zÀ-ÿ.\s]+$/.test(primeraLinea) &&
      !/curriculum|resume|cv\b/i.test(primeraLinea);
    if (pareceNombre) return primeraLinea;
  }
  return nombreDesdeArchivo(fileName);
}

function extraerAniosExperiencia(normText) {
  const matches = [...normText.matchAll(/(\d{1,2})\s*\+?\s*(?:anos|ano)\b/g)];
  if (!matches.length) return null;
  const nums = matches.map((m) => parseInt(m[1], 10)).filter((n) => n > 0 && n < 40);
  if (!nums.length) return null;
  return Math.max(...nums);
}

/* ----------------------------------------------------------------------- */
/* EXTRACCIÓN DE TEXTO DEL PDF (PDF.js, cargado dinámicamente)             */
/* ----------------------------------------------------------------------- */

const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174";

function usePdfJs() {
  const [status, setStatus] = useState("cargando");

  useEffect(() => {
    if (window.pdfjsLib) {
      setStatus("listo");
      return;
    }
    const script = document.createElement("script");
    script.src = `${PDFJS_BASE}/pdf.min.js`;
    script.async = true;
    script.onload = async () => {
      try {
        const workerCode = await fetch(`${PDFJS_BASE}/pdf.worker.min.js`).then((r) => r.text());
        const blob = new Blob([workerCode], { type: "application/javascript" });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
        setStatus("listo");
      } catch (e) {
        setStatus("error");
      }
    };
    script.onerror = () => setStatus("error");
    document.body.appendChild(script);
  }, []);

  return status;
}

async function extraerTextoPDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let texto = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    texto += content.items.map((it) => it.str).join(" ") + "\n";
  }
  return texto;
}

/* ----------------------------------------------------------------------- */
/* MOTOR DE ANÁLISIS POR COINCIDENCIAS                                     */
/* ----------------------------------------------------------------------- */

function analizarCandidatoPorCoincidencias({ textoOriginal, fileName, vacante, salarioManual }) {
  const norm = normalizar(textoOriginal);
  const tieneTexto = norm.trim().length > 40;

  if (!tieneTexto) {
    return {
      id: fileName,
      nombre: nombreDesdeArchivo(fileName),
      archivo: fileName,
      sinTexto: true,
      compatibilidad: null,
      estado: "revisar",
      resumen:
        "No fue posible extraer texto de este PDF (probablemente es un documento escaneado o basado en imágenes). Se necesita revisión manual.",
      recomendacion: "Revisión manual requerida: el sistema no pudo leer el contenido del archivo.",
      riesgos: ["No se pudo extraer texto del PDF."],
      criteriosEval: {},
      salarioSolicitado: salarioManual || null,
      experienciaAnios: null,
    };
  }

  const nombre = extraerNombreProbable(textoOriginal, fileName);
  const riesgos = [];
  const criteriosEval = {};
  let score = 0;

  let formacionStatus;
  if (matchAny(norm, KEYWORDS.periodismo) || matchAny(norm, KEYWORDS.cienciasComunicacion)) {
    formacionStatus = "cumple";
    score += 25;
  } else if (matchAny(norm, KEYWORDS.comunicacionGeneral)) {
    formacionStatus = "parcial";
    score += 12;
  } else {
    formacionStatus = "no_cumple";
    score += 4;
    riesgos.push("No se encontró evidencia de Licenciatura en Periodismo o Ciencias de la Comunicación.");
  }
  criteriosEval.formacion = {
    status: formacionStatus,
    comentario:
      formacionStatus === "cumple"
        ? "Se detectó la formación requerida en el texto del CV."
        : formacionStatus === "parcial"
        ? "Se menciona 'Comunicación' de forma genérica, no específicamente Ciencias de la Comunicación."
        : "No se detectó la formación solicitada en el texto del CV.",
  };

  const ubicacionOk = matchAny(norm, KEYWORDS.ubicacion);
  score += ubicacionOk ? 15 : 0;
  criteriosEval.ubicacion = {
    status: ubicacionOk ? "cumple" : "no_cumple",
    comentario: ubicacionOk
      ? "Se detectó residencia en CDMX o zona conurbada."
      : "No se detectó residencia en CDMX o zona conurbada en el CV.",
  };
  if (!ubicacionOk) riesgos.push("No se identificó residencia en CDMX o zona conurbada.");

  const mediosOk = matchAny(norm, KEYWORDS.mediosNacionales);
  score += mediosOk ? 15 : 3;
  criteriosEval.medios = {
    status: mediosOk ? "cumple" : "no_cumple",
    comentario: mediosOk
      ? "Se detectó experiencia en medios de alcance nacional."
      : "No se detectó experiencia en medios de alcance nacional (El Universal, Excelsior, Milenio, N+, Infobae, Animal Político u otro).",
  };
  if (!mediosOk) riesgos.push("Sin evidencia de experiencia en medios de alcance nacional.");

  const anios = extraerAniosExperiencia(norm);
  if (anios === null) {
    score += 7;
    criteriosEval.experiencia = {
      status: "parcial",
      comentario: "No se pudo determinar automáticamente los años de experiencia; revisar manualmente.",
    };
  } else if (anios >= 1 && anios <= 3) {
    score += 15;
    criteriosEval.experiencia = { status: "cumple", comentario: `${anios} año(s) de experiencia detectados, dentro del rango ideal.` };
  } else if (anios < 1) {
    score += 5;
    criteriosEval.experiencia = { status: "no_cumple", comentario: "Menos de 1 año de experiencia detectado." };
    riesgos.push("Experiencia detectada por debajo de 1 año.");
  } else {
    score += Math.max(15 - 2 * (anios - 3), 6);
    criteriosEval.experiencia = {
      status: "parcial",
      comentario: `${anios} año(s) de experiencia detectados (por encima del rango ideal de 1 a 3 años).`,
    };
  }

  const skillDefs = [
    { id: "redaccion", kws: KEYWORDS.redaccion },
    { id: "edicion", kws: KEYWORDS.edicion },
    { id: "breaking", kws: KEYWORDS.breaking },
    { id: "monitoreo", kws: KEYWORDS.monitoreo },
    { id: "equipo", kws: KEYWORDS.equipo },
  ];
  let sumaSkills = 0;
  skillDefs.forEach((s) => {
    const ok = matchAny(norm, s.kws);
    if (ok) sumaSkills += 1;
    criteriosEval[s.id] = {
      status: ok ? "cumple" : "no_cumple",
      comentario: ok ? "Mencionado explícitamente en el CV." : "No se encontró mención explícita en el CV.",
    };
  });
  score += (sumaSkills / skillDefs.length) * 20;

  const inglesOk = matchAny(norm, KEYWORDS.ingles);
  score += inglesOk ? 5 : 0;
  criteriosEval.ingles = {
    status: inglesOk ? "cumple" : "no_cumple",
    comentario: inglesOk ? "Se menciona inglés en el CV." : "No se menciona inglés (habilidad deseable, no eliminatoria).",
  };

  if (salarioManual) {
    const excedente = salarioManual / vacante.salarioOfrecido;
    let salStatus;
    if (excedente <= 1.05) {
      salStatus = "cumple";
      score += 5;
    } else if (excedente <= 1.15) {
      salStatus = "parcial";
      score += 2;
    } else {
      salStatus = "no_cumple";
      riesgos.push(
        `Pretensión salarial de $${salarioManual.toLocaleString("es-MX")} MXN, ${Math.round(
          (excedente - 1) * 100
        )}% por encima del salario ofrecido ($${vacante.salarioOfrecido.toLocaleString("es-MX")} MXN).`
      );
    }
    criteriosEval.salario = {
      status: salStatus,
      comentario: `Pretensión indicada: $${salarioManual.toLocaleString("es-MX")} MXN vs. $${vacante.salarioOfrecido.toLocaleString("es-MX")} MXN ofrecidos.`,
    };
  } else {
    criteriosEval.salario = {
      status: "parcial",
      comentario: "Pretensión salarial no indicada (no suele venir en el CV); captúrala manualmente para evaluarla.",
    };
  }

  const esBecario = matchAny(norm, KEYWORDS.becario);
  const esCreadorRedes = matchAny(norm, KEYWORDS.creadorRedes);
  const esBranded = matchAny(norm, KEYWORDS.brandedContent);
  const esMedioPequeno = matchAny(norm, KEYWORDS.medioPequeno) && !mediosOk;

  let descarte = false;
  if (esBecario) {
    descarte = true;
    riesgos.unshift("Criterio de descarte: se detectó perfil de becario/practicante.");
  }
  if (esCreadorRedes) {
    descarte = true;
    riesgos.unshift("Criterio de descarte: perfil orientado a creación de contenido para redes (TikTok/YouTube).");
  }
  if (esBranded) {
    descarte = true;
    riesgos.unshift("Criterio de descarte: experiencia en branded content / contenido publicitario.");
  }
  if (esMedioPequeno) {
    descarte = true;
    riesgos.unshift("Criterio de descarte: experiencia limitada a medios estatales pequeños, Facebook o YouTube sin alcance nacional.");
  }

  let compatibilidad = Math.max(0, Math.min(100, Math.round(score)));
  if (descarte) compatibilidad = Math.min(compatibilidad, 20);

  let estado;
  if (descarte) estado = "baja";
  else if (compatibilidad >= 85) estado = "muy_recomendado";
  else if (compatibilidad >= 70) estado = "recomendado";
  else if (compatibilidad >= 50) estado = "revisar";
  else estado = "baja";

  const resumen = [
    formacionStatus === "cumple" ? "Cuenta con la formación requerida." : "No se confirmó la formación requerida en el texto del CV.",
    ubicacionOk ? "Reside en CDMX o zona conurbada." : "No se confirmó residencia en CDMX o zona conurbada.",
    mediosOk ? "Tiene experiencia en medios de alcance nacional." : "No se detectó experiencia en medios de alcance nacional.",
    descarte ? "Se detectó al menos un criterio de descarte para esta vacante." : "",
  ]
    .filter(Boolean)
    .join(" ");

  const recomendacion = descarte
    ? "Este perfil cumple con uno o más criterios de descarte definidos para la vacante; no se recomienda continuar el proceso."
    : estado === "muy_recomendado"
    ? "Perfil altamente alineado con la vacante. Se recomienda avanzar a entrevista."
    : estado === "recomendado"
    ? "Buen encaje general con la vacante. Se recomienda considerar para entrevista."
    : estado === "revisar"
    ? "Encaje parcial o con datos insuficientes; conviene revisar manualmente antes de decidir."
    : "El perfil se aleja de forma importante de los requisitos de la vacante.";

  return {
    id: `${fileName}-${norm.length}`,
    nombre,
    archivo: fileName,
    compatibilidad,
    estado,
    resumen,
    recomendacion,
    riesgos,
    criteriosEval,
    salarioSolicitado: salarioManual || null,
    experienciaAnios: anios,
  };
}

function EstadoBadge({ estado }) {

function CriterioIcon({ status }) {
  if (status === "cumple") return <Icon name="check" size={16} style={{ color: "#1E8E5A" }} />;
  if (status === "parcial") return <Icon name="alert" size={16} style={{ color: "#B4740E" }} />;

}

function ScanMeter({ value }) {
  if (value === null) {
    return <span className="ts-muted-sm">Sin datos</span>;
  }
  const cfg =
    value >= 85 ? ESTADOS.muy_recomendado : value >= 70 ? ESTADOS.recomendado : value >= 50 ? ESTADOS.revisar : ESTADOS.baja;
  return (
    <div className="ts-meter-wrap">
      <div className="ts-meter-track">
        <div className="ts-meter-fill" style={{ width: `${value}%`, backgroundColor: cfg.color }} />
      </div>
      <span className="ts-meter-value" style={{ color: cfg.color }}>
        {value}%
      </span>
    </div>
  );
}

function Stepper({ step }) {
  const steps = [
    { n: 1, label: "Vacante" },
    { n: 2, label: "Candidatos" },
    { n: 3, label: "Resultados" },
  ];
  return (
    <div className="ts-stepper">
      {steps.map((s, i) => (
        <React.Fragment key={s.n}>
          <div className="ts-step">
            <div className={`ts-step-circle ${step === s.n ? "is-active" : step > s.n ? "is-done" : ""}`}>
              {step > s.n ? <Icon name="check" size={16} /> : s.n}
            </div>
            <span className={`ts-step-label ${step === s.n ? "is-active" : ""}`}>{s.label}</span>
          </div>
          {i < steps.length - 1 && <div className={`ts-step-line ${step > s.n ? "is-done" : ""}`} />}
        </React.Fragment>
      ))}
    </div>
  );
}

function PasoCandidatos({ files, setFiles, salarios, setSalarios, onBack, onAnalyze, isAnalyzing, progress, pdfStatus }) {
  const [isDragging, setIsDragging] = useState(false);

  const addFiles = useCallback(
    (fileList) => {
      const nuevos = Array.from(fileList).filter((f) => f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf"));
      setFiles((prev) => {
        const existentes = new Set(prev.map((f) => f.name + f.size));
        const filtrados = nuevos.filter((f) => !existentes.has(f.name + f.size));
        return [...prev, ...filtrados];
      });
    },
    [setFiles]
  );

  const handleDrop = (e) => {
    e.preventDefault();
    setIsDragging(false);
    if (e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  };

  const removeFile = (idx) => setFiles((prev) => prev.filter((_, i) => i !== idx));

  return (
    <div className="ts-fade-in">
      <div className="ts-card">
        <div className="ts-card-title">
          <Icon name="upload" size={16} /> Sube los CVs en PDF de los candidatos
        </div>

        <div
          className={`ts-dropzone ${isDragging ? "is-dragging" : ""}`}
          onDragOver={(e) => {
            e.preventDefault();
            setIsDragging(true);
          }}
          onDragLeave={() => setIsDragging(false)}
          onDrop={handleDrop}
          onClick={() => document.getElementById("ts-file-input").click()}
        >
          <Icon name="upload" size={28} style={{ opacity: 0.55 }} />
          <p className="ts-body" style={{ margin: "8px 0 2px" }}>
            Arrastra los archivos aquí o haz clic para seleccionarlos
          </p>
          <p className="ts-muted-sm">Solo PDF con texto seleccionable · puedes subir varios a la vez</p>
          <input
            id="ts-file-input"
            type="file"
            accept="application/pdf"
            multiple
            style={{ display: "none" }}
            onChange={(e) => e.target.files && addFiles(e.target.files)}
          />
        </div>

        {files.length > 0 && (
          <div className="ts-file-list">
            {files.map((f, i) => {
              const key = f.name + f.size;
              return (
                <div className="ts-file-row" key={key}>
                  <Icon name="filetext" size={16} style={{ opacity: 0.6, flexShrink: 0 }} />
                  <span className="ts-file-name">{f.name}</span>
                  <span className="ts-muted-sm">{(f.size / 1024).toFixed(0)} KB</span>
                  <div className="ts-salario-mini">
                    <span className="ts-muted-sm">Pretensión $</span>
                    <input
                      type="number"
                      placeholder="opcional"
                      value={salarios[key] || ""}
                      onChange={(e) =>
                        setSalarios((prev) => ({ ...prev, [key]: e.target.value ? Number(e.target.value) : undefined }))
                      }
                    />
                  </div>
                  <button className="ts-icon-btn" onClick={() => removeFile(i)} aria-label={`Quitar ${f.name}`}>
                    <Icon name="x" size={14} />
                  </button>
                </div>
              );
            })}
          </div>
        )}

        {pdfStatus === "error" && (
          <div className="ts-notice ts-notice--warn">
            No se pudo cargar el lector de PDF (revisa tu conexión a internet), así que no es posible analizar
            automáticamente. Puedes reintentar recargando la página.
          </div>
        )}

        {isAnalyzing && (
          <div style={{ marginTop: 16 }}>
            <div className="ts-progress-track">
              <div className="ts-progress-fill" style={{ width: `${progress}%` }} />
            </div>
            <p className="ts-muted-sm" style={{ marginTop: 6 }}>
              Leyendo y analizando candidatos contra el perfil de Editor Web… {progress}%
            </p>
          </div>
        )}
      </div>

      <div className="ts-actions-between">
        <button className="ts-btn ts-btn--ghost" onClick={onBack} disabled={isAnalyzing}>
          <Icon name="arrowleft" size={16} /> Volver a la vacante
        </button>
        <button
          className="ts-btn ts-btn--primary"
          onClick={onAnalyze}
          disabled={files.length === 0 || isAnalyzing || pdfStatus !== "listo"}
        >
          {pdfStatus === "cargando" ? (
            <>
              <Icon name="loader" size={16} style={{ animation: "tsSpin 0.9s linear infinite" }} /> Cargando lector de PDF…
            </>
          ) : (
            <>
              <Icon name="scan" size={16} />
              {isAnalyzing ? "Analizando…" : `Analizar ${files.length || ""} candidato${files.length === 1 ? "" : "s"}`}
            </>
          )}
        </button>
      </div>
    </div>
  );
}

function PasoResultados({ candidatos, onBack, onReiniciar }) {
  const [filtro, setFiltro] = useState("todos");

    const base = filtro === "todos" ? candidatos : candidatos.filter((c) => c.estado === filtro);

      return vb - va;
    });
  }, [candidatos, filtro]);

  const conteos = useMemo(() => {
    const c = { muy_recomendado: 0, recomendado: 0, revisar: 0, baja: 0 };
    candidatos.forEach((cand) => (c[cand.estado] += 1));
    return c;
  }, [candidatos]);

  return (
    <div className="ts-fade-in">
      <div className="ts-resultados-header">
        <div>
          <h2 className="ts-h2" style={{ marginBottom: 2 }}>
            Ranking de candidatos
          </h2>
          <p className="ts-muted-sm">
            {candidatos.length} candidato{candidatos.length === 1 ? "" : "s"} evaluado
            {candidatos.length === 1 ? "" : "s"} contra el perfil de Editor Web
          </p>
        </div>
        <button className="ts-btn ts-btn--ghost" onClick={onReiniciar}>
          Nuevo análisis
        </button>
      </div>

      <div className="ts-filtros">
        <Icon name="sliders" size={14} style={{ opacity: 0.5 }} />
        {[
          { id: "todos", label: `Todos (${candidatos.length})` },
          { id: "muy_recomendado", label: `Muy recomendado (${conteos.muy_recomendado})` },
          { id: "recomendado", label: `Recomendado (${conteos.recomendado})` },
          { id: "revisar", label: `Revisar (${conteos.revisar})` },
          { id: "baja", label: `Baja compatibilidad (${conteos.baja})` },
        ].map((f) => (
          <button key={f.id} className={`ts-filtro-chip ${filtro === f.id ? "is-active" : ""}`} onClick={() => setFiltro(f.id)}>
            {f.label}
          </button>
        ))}
      </div>

      <div className="ts-candidatos-list">
        {filtrados.map((c) => (
          <CandidatoCard
            key={c.id}
            candidato={c}
            expanded={expandedId === c.id}
            onToggle={() => setExpandedId(expandedId === c.id ? null : c.id)}
          />
        ))}
        {filtrados.length === 0 && (
          <div className="ts-card" style={{ textAlign: "center", color: "var(--ts-muted)" }}>
            No hay candidatos en este filtro.
          </div>
        )}
      </div>

      <div className="ts-actions-left">
        <button className="ts-btn ts-btn--ghost" onClick={onBack}>
          <Icon name="arrowleft" size={16} /> Volver a candidatos
        </button>
      </div>
    </div>
  );
}

/* ----------------------------------------------------------------------- */
/* APP PRINCIPAL                                                           */
/* ----------------------------------------------------------------------- */

function TalentScan() {
  const [step, setStep] = useState(1);
  const [vacante, setVacante] = useState(VACANTE_EDITOR_WEB);
  const [files, setFiles] = useState([]);
  const [salarios, setSalarios] = useState({});
  const [candidatos, setCandidatos] = useState([]);
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [progress, setProgress] = useState(0);
  const pdfStatus = usePdfJs();

  const analizar = async () => {
    setIsAnalyzing(true);
    setProgress(0);
    const resultados = [];

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const key = f.name + f.size;
      try {
        const texto = await extraerTextoPDF(f);
        resultados.push(
          analizarCandidatoPorCoincidencias({
            textoOriginal: texto,
            fileName: f.name,
            vacante,
            salarioManual: salarios[key],
          })
        );
      } catch (e) {
        resultados.push(
          analizarCandidatoPorCoincidencias({
            textoOriginal: "",
            fileName: f.name,
            vacante,
            salarioManual: salarios[key],
          })
        );
      }
      setProgress(Math.round(((i + 1) / files.length) * 100));
    }

    setCandidatos(resultados);
    setIsAnalyzing(false);
    setStep(3);
  };

  const reiniciar = () => {
    setFiles([]);
    setSalarios({});
    setCandidatos([]);
    setStep(2);
  };

  return (
    <div className="ts-root">
      <div className="ts-shell">
        <div className="ts-brand">
          <div className="ts-brand-icon">
            <Icon name="scan" size={19} />
          </div>
          <div>
            <div className="ts-brand-name">Talent Scan</div>
            <div className="ts-brand-tag">Preselección de candidatos — apoyo a la decisión de RH</div>
          </div>
        </div>

        <Stepper step={step} />

        {step === 1 && <PasoVacante vacante={vacante} setVacante={setVacante} onNext={() => setStep(2)} />}

        {step === 2 && (
          <PasoCandidatos
            files={files}
            setFiles={setFiles}
            salarios={salarios}
            setSalarios={setSalarios}
            onBack={() => setStep(1)}
            onAnalyze={analizar}
            isAnalyzing={isAnalyzing}
            progress={progress}
            pdfStatus={pdfStatus}
          />
        )}

        {step === 3 && <PasoResultados candidatos={candidatos} onBack={() => setStep(2)} onReiniciar={reiniciar} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TalentScan />);

 * NOTA: CÓMO CONECTAR IA REAL MÁS ADELANTE (fase 2)

 * El único bloque que cambiaría es el `for` dentro de `analizar()`: en vez
 * de extraer texto con PDF.js y correr el motor de coincidencias, se manda
 * el PDF (en base64) directo a la API de Claude como bloque tipo
 * "document", junto con el perfil de la vacante en el prompt, pidiendo un
 * JSON con la misma forma que ya regresa la función de coincidencias
 * (compatibilidad, estado, resumen, riesgos, criteriosEval, recomendacion).
 * Ventaja: Claude lee el PDF directamente, sin PDF.js ni listas de
 * palabras clave, y entiende sinónimos y contexto que este motor no capta.
 * ============================================================================
 */
</script>
</body>
