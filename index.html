<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Talent Scan REFORMA</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: #F5F7F8; }
  #root { min-height: 100vh; }

  .ts-root {
    --ts-bg: #F5F7F8;
    --ts-surface: #FFFFFF;
    --ts-ink: #14231F;
    --ts-muted: #5B6B67;
    --ts-border: #E4E9E7;
    --ts-primary: #0F6B5C;
    --ts-primary-soft: #E4F2EE;
    background: var(--ts-bg);
    color: var(--ts-ink);
    min-height: 100%;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 32px 24px 64px;
  }
  .ts-shell { max-width: 900px; margin: 0 auto; }

  .ts-brand { display: flex; align-items: center; gap: 14px; margin-bottom: 28px; }
  .ts-brand-icon {
    width: 44px; height: 44px; border-radius: 12px; flex-shrink: 0;
    background: var(--ts-primary); color: white;
    display: flex; align-items: center; justify-content: center;
  }
  .ts-brand-name { font-size: 27px; font-weight: 800; letter-spacing: -0.02em; display: flex; align-items: baseline; gap: 9px; line-height: 1; }
  .ts-brand-org { font-size: 15px; font-weight: 700; color: var(--ts-primary); letter-spacing: 0.03em; }
  .ts-version-badge {
    display: inline-block; margin-top: 6px; font-size: 10.5px; font-weight: 700; color: var(--ts-muted);
    background: var(--ts-surface); border: 1px solid var(--ts-border); padding: 2px 9px; border-radius: 999px;
  }

  .ts-stepper { display: flex; align-items: center; gap: 8px; margin-bottom: 24px; }
  .ts-step { display: flex; align-items: center; gap: 8px; }
  .ts-step-circle {
    width: 26px; height: 26px; border-radius: 999px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700;
    background: var(--ts-surface); border: 1.5px solid var(--ts-border); color: var(--ts-muted);
  }
  .ts-step-circle.is-active { background: var(--ts-primary); border-color: var(--ts-primary); color: white; }
  .ts-step-circle.is-done { background: var(--ts-primary-soft); border-color: var(--ts-primary); color: var(--ts-primary); }
  .ts-step-label { font-size: 13px; color: var(--ts-muted); font-weight: 500; }
  .ts-step-label.is-active { color: var(--ts-ink); font-weight: 700; }
  .ts-step-line { width: 40px; height: 1.5px; background: var(--ts-border); }
  .ts-step-line.is-done { background: var(--ts-primary); }

  .ts-vacante-selector { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .ts-vacante-chip {
    font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 10px;
    border: 1.5px solid var(--ts-border); background: var(--ts-surface); color: var(--ts-muted); cursor: pointer;
  }
  .ts-vacante-chip.is-active { border-color: var(--ts-primary); background: var(--ts-primary-soft); color: var(--ts-primary); }

  .ts-fade-in { animation: tsFadeIn 0.25s ease; }
  @keyframes tsFadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes tsSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

  .ts-card {
    background: var(--ts-surface); border: 1px solid var(--ts-border);
    border-radius: 16px; padding: 20px 22px;
  }
  .ts-card--hero { background: linear-gradient(135deg, var(--ts-primary-soft), var(--ts-surface)); }
  .ts-grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 640px) { .ts-grid-2 { grid-template-columns: 1fr; } }

  .ts-eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    color: var(--ts-primary); margin-bottom: 8px;
  }
  .ts-h2 { font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin: 0 0 6px; }
  .ts-card-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 700; color: var(--ts-muted);
    text-transform: uppercase; letter-spacing: 0.03em; margin-bottom: 12px;
  }
  .ts-body { font-size: 14px; line-height: 1.55; margin: 0; }
  .ts-muted { color: var(--ts-muted); }
  .ts-muted-sm { font-size: 12px; color: var(--ts-muted); }
  .ts-list { margin: 0; padding-left: 18px; font-size: 14px; line-height: 1.7; }
  .ts-chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .ts-chip { font-size: 12.5px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: var(--ts-primary-soft); color: var(--ts-primary); }
  .ts-chip--soft { background: var(--ts-bg); color: var(--ts-muted); }

  .ts-actions-right { display: flex; justify-content: flex-end; margin-top: 22px; }
  .ts-actions-left { display: flex; justify-content: flex-start; margin-top: 22px; }
  .ts-actions-between { display: flex; justify-content: space-between; margin-top: 22px; }

  .ts-btn {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13.5px; font-weight: 700; padding: 10px 18px; border-radius: 10px;
    border: none; cursor: pointer; transition: opacity 0.15s, transform 0.1s;
  }
  .ts-btn:active { transform: scale(0.98); }
  .ts-btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .ts-btn--primary { background: var(--ts-primary); color: white; }
  .ts-btn--primary:hover:not(:disabled) { opacity: 0.9; }
  .ts-btn--ghost { background: transparent; color: var(--ts-ink); border: 1px solid var(--ts-border); }
  .ts-btn--ghost:hover:not(:disabled) { background: var(--ts-primary-soft); }

  .ts-dropzone {
    margin-top: 4px; border: 1.5px dashed var(--ts-border); border-radius: 14px;
    padding: 30px 20px; text-align: center; cursor: pointer; transition: all 0.15s;
  }
  .ts-dropzone:hover, .ts-dropzone.is-dragging { border-color: var(--ts-primary); background: var(--ts-primary-soft); }
  .ts-file-list { margin-top: 14px; display: flex; flex-direction: column; gap: 6px; }
  .ts-file-row { display: flex; align-items: center; gap: 10px; padding: 8px 10px; background: var(--ts-bg); border-radius: 8px; font-size: 13px; }
  .ts-file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ts-salario-mini { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .ts-salario-mini input { width: 76px; border: 1px solid var(--ts-border); border-radius: 6px; padding: 3px 6px; font-size: 12.5px; background: var(--ts-surface); }
  .ts-icon-btn { border: none; background: transparent; cursor: pointer; color: var(--ts-muted); display: flex; align-items: center; padding: 4px; border-radius: 6px; flex-shrink: 0; }
  .ts-icon-btn:hover { background: var(--ts-border); color: var(--ts-ink); }

  .ts-notice { margin-top: 14px; padding: 10px 14px; border-radius: 10px; font-size: 12.5px; line-height: 1.5; }
  .ts-notice--warn { background: #FCF1DD; color: #7A5209; }

  .ts-progress-track { height: 6px; border-radius: 999px; background: var(--ts-border); overflow: hidden; }
  .ts-progress-fill { height: 100%; background: var(--ts-primary); transition: width 0.25s ease; }

  .ts-resultados-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; }
  .ts-filtros { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
  .ts-filtro-chip { font-size: 12.5px; font-weight: 600; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--ts-border); background: var(--ts-surface); color: var(--ts-muted); cursor: pointer; }
  .ts-filtro-chip.is-active { background: var(--ts-ink); border-color: var(--ts-ink); color: white; }

  .ts-candidatos-list { display: flex; flex-direction: column; gap: 12px; }
  .ts-candidato-card { padding: 16px 18px; }
  .ts-candidato-header { width: 100%; display: flex; justify-content: space-between; align-items: center; background: none; border: none; cursor: pointer; padding: 0; font: inherit; color: inherit; }
  .ts-candidato-main { display: flex; align-items: center; gap: 12px; text-align: left; }
  .ts-avatar { width: 38px; height: 38px; border-radius: 10px; background: var(--ts-primary-soft); color: var(--ts-primary); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex-shrink: 0; }
  .ts-candidato-nombre { font-weight: 700; font-size: 14.5px; }
  .ts-candidato-right { display: flex; align-items: center; gap: 14px; }
  .ts-resumen { margin-top: 12px; color: var(--ts-muted); }

  .ts-badge { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }

  .ts-meter-wrap { display: flex; align-items: center; gap: 8px; }
  .ts-meter-track { width: 84px; height: 6px; border-radius: 999px; background: var(--ts-border); overflow: hidden; }
  .ts-meter-fill { height: 100%; border-radius: 999px; transition: width 0.6s ease; }
  .ts-meter-value { font-family: ui-monospace, "SF Mono", monospace; font-weight: 700; font-size: 13px; width: 38px; }

  .ts-detalle { margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--ts-border); display: grid; grid-template-columns: 1.2fr 1fr; gap: 26px; }
  @media (max-width: 640px) { .ts-detalle { grid-template-columns: 1fr; } }
  .ts-detalle-heading { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ts-muted); margin-bottom: 10px; }
  .ts-criterios { display: flex; flex-direction: column; gap: 10px; }
  .ts-criterio-row { display: flex; gap: 8px; align-items: flex-start; }
  .ts-criterio-label { font-size: 13.5px; font-weight: 600; }
  .ts-riesgos { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .ts-riesgos li { display: flex; gap: 8px; font-size: 13px; line-height: 1.5; }
</style>
</head>

<div id="root"></div>

<script type="text/babel">
/**
 * ============================================================================
 * TALENT SCAN REFORMA — index.html (vista para RH, SOLO LECTURA)
 * ============================================================================
 * Esta versión NO tiene panel de edición. Los criterios de cada vacante se
 * cargan desde vacantes.json (mismo folder). Para editar vacantes o agregar
 * nuevas, se usa la herramienta separada `vacantes-editor.html` — esa nunca
 * se sube a producción, es de uso interno.
 *
 * Si vacantes.json no existe o falla la carga, se usan los datos por
 * defecto (VACANTES_INICIALES) definidos abajo, para que la app nunca se
 * quede sin funcionar.
 *
 * VERSIONADO: v0.1, v0.2, v0.3... hasta v0.9, luego v1.0. Después de v1.9,
 * v2.0, y así. Súbelo a mano en la constante VERSION cada vez que subas un
 * cambio relevante.
 * ============================================================================
 */

const VERSION = "0.2";

const { useState, useCallback, useMemo, useEffect } = React;

/* ----------------------------------------------------------------------- */
/* UTILIDADES DE TEXTO                                                     */
/* ----------------------------------------------------------------------- */

function normalizar(str) {
  return (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}
function matchAny(text, keywords) {
  return (keywords || []).some((k) => text.includes(k));
}
function nombreDesdeArchivo(fileName) {
  const sinExtension = fileName.replace(/\.[^/.]+$/, "");
  const limpio = sinExtension.replace(/[_\-]+/g, " ").replace(/\s+/g, " ").trim();
  return limpio.split(" ").map((w) => (w.length ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w)).join(" ");
}
function extraerNombreProbable(textoOriginal, fileName) {
  const primeraLinea = (textoOriginal || "").split("\n").map((l) => l.trim()).find((l) => l.length > 0);
  if (primeraLinea && primeraLinea.length >= 4 && primeraLinea.length <= 45) {
    const palabras = primeraLinea.split(/\s+/);
    const pareceNombre = palabras.length >= 2 && palabras.length <= 4 && /^[A-Za-zÀ-ÿ.\s]+$/.test(primeraLinea) && !/curriculum|resume|cv\b/i.test(primeraLinea);
    if (pareceNombre) return primeraLinea;
  }
  return nombreDesdeArchivo(fileName);
}
function extraerAniosExperiencia(normText) {
  const matches = [...normText.matchAll(/(\d{1,2})\s*\+?\s*(?:anos|ano)\b/g)];
  if (!matches.length) return null;
  const nums = matches.map((m) => parseInt(m[1], 10)).filter((n) => n > 0 && n < 40);
  if (!nums.length) return null;
  return Math.max(...nums);
}
function comentarioGenerico(label, status) {
  if (status === "cumple") return `Se detectó "${label}" en el texto del CV.`;
  if (status === "parcial") return `Se encontró una coincidencia parcial relacionada con "${label}".`;
  return `No se detectó "${label}" en el texto del CV.`;
}

/* ----------------------------------------------------------------------- */
/* EXTRACCIÓN DE TEXTO DEL PDF (PDF.js, cargado dinámicamente)             */
/* ----------------------------------------------------------------------- */

const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174";

function usePdfJs() {
  const [status, setStatus] = useState("cargando");
  useEffect(() => {
    if (window.pdfjsLib) { setStatus("listo"); return; }
    const script = document.createElement("script");
    script.src = `${PDFJS_BASE}/pdf.min.js`;
    script.async = true;
    script.onload = async () => {
      try {
        const workerCode = await fetch(`${PDFJS_BASE}/pdf.worker.min.js`).then((r) => r.text());
        const blob = new Blob([workerCode], { type: "application/javascript" });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
        setStatus("listo");
      } catch (e) { setStatus("error"); }
    };
    script.onerror = () => setStatus("error");
    document.body.appendChild(script);
  }, []);
  return status;
}

async function extraerTextoPDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let texto = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    texto += content.items.map((it) => it.str).join(" ") + "\n";
  }
  return texto;
}

/* ----------------------------------------------------------------------- */
/* MOTOR DE ANÁLISIS GENÉRICO                                              */
/* ----------------------------------------------------------------------- */

function analizarCandidatoPorCoincidencias({ textoOriginal, fileName, vacante, salarioManual }) {
  const norm = normalizar(textoOriginal);
  const tieneTexto = norm.trim().length > 40;

  if (!tieneTexto) {
    return {
      id: fileName, nombre: nombreDesdeArchivo(fileName), archivo: fileName, sinTexto: true,
      compatibilidad: null, estado: "revisar",
      resumen: "No fue posible extraer texto de este PDF (probablemente es un documento escaneado o basado en imágenes). Se necesita revisión manual.",
      recomendacion: "Revisión manual requerida: el sistema no pudo leer el contenido del archivo.",
      riesgos: ["No se pudo extraer texto del PDF."], criteriosEval: {},
      salarioSolicitado: salarioManual || null, experienciaAnios: null,
    };
  }

  const nombre = extraerNombreProbable(textoOriginal, fileName);
  const riesgos = [];
  const criteriosEval = {};
  let score = 0;
  let maxScore = 0;
  let descarte = false;
  let experienciaAniosDetectados = null;

  vacante.criterios.forEach((criterio) => {
    if (criterio.tipo === "areaNoRelacionada") {
      const disparado = matchAny(norm, criterio.keywords) && !matchAny(norm, criterio.keywordsExcluyentes);
      if (disparado) { descarte = true; riesgos.unshift(criterio.descarteMensaje); }
      return;
    }

    let status, s, comentario;

    if (criterio.tipo === "keyword") {
      const ok = matchAny(norm, criterio.keywords);
      const parcialOk = !ok && criterio.keywordsParcial ? matchAny(norm, criterio.keywordsParcial) : false;
      status = ok ? "cumple" : parcialOk ? "parcial" : "no_cumple";
      s = ok ? criterio.peso : parcialOk ? (criterio.pesoParcial !== undefined ? criterio.pesoParcial : Math.round(criterio.peso / 2)) : (criterio.pesoNoCumple !== undefined ? criterio.pesoNoCumple : 0);
      comentario = comentarioGenerico(criterio.label, status);
    } else if (criterio.tipo === "url") {
      const urlRegex = /https?:\/\/|www\.|behance|dribbble/;
      const ok = urlRegex.test(norm) || matchAny(norm, criterio.keywords);
      status = ok ? "cumple" : "no_cumple";
      s = ok ? criterio.peso : (criterio.pesoNoCumple !== undefined ? criterio.pesoNoCumple : 0);
      comentario = comentarioGenerico(criterio.label, status);
    } else if (criterio.tipo === "anios") {
      const anios = extraerAniosExperiencia(norm);
      experienciaAniosDetectados = anios;
      if (anios === null) {
        status = "parcial"; s = Math.round(criterio.peso * 0.45);
        comentario = "No se pudo determinar automáticamente los años de experiencia; revisar manualmente.";
      } else if (anios >= criterio.anioMin && anios <= criterio.anioMax) {
        status = "cumple"; s = criterio.peso;
        comentario = `${anios} año(s) de experiencia detectados, dentro del rango ideal.`;
      } else if (anios < criterio.anioMin) {
        status = "no_cumple"; s = Math.max(Math.round(criterio.peso * (anios / Math.max(criterio.anioMin, 1)) * 0.5), 0);
        comentario = "Experiencia detectada por debajo del mínimo requerido.";
      } else {
        const exceso = anios - criterio.anioMax;
        status = "parcial"; s = Math.max(criterio.peso - 2 * exceso, Math.round(criterio.peso * 0.4));
        comentario = `${anios} año(s) de experiencia detectados (fuera del rango ideal de ${criterio.anioMin} a ${criterio.anioMax}).`;
      }
    } else if (criterio.tipo === "salario") {
      if (!salarioManual) {
        status = "parcial"; s = 0;
        comentario = "Pretensión salarial no indicada (no suele venir en el CV); captúrala manualmente para evaluarla.";
      } else {
        const excedente = salarioManual / vacante.salarioOfrecido;
        if (excedente <= 1.05) { status = "cumple"; s = criterio.peso; }
        else if (excedente <= 1.15) { status = "parcial"; s = Math.round(criterio.peso * 0.4); }
        else {
          status = "no_cumple"; s = 0;
          riesgos.push(`Pretensión salarial de $${salarioManual.toLocaleString("es-MX")} MXN, ${Math.round((excedente - 1) * 100)}% por encima del salario ofrecido ($${vacante.salarioOfrecido.toLocaleString("es-MX")} MXN).`);
        }
        comentario = `Pretensión indicada: $${salarioManual.toLocaleString("es-MX")} MXN vs. $${vacante.salarioOfrecido.toLocaleString("es-MX")} MXN ofrecidos.`;
      }
    }

    if (!criterio.soloDescarte) { maxScore += criterio.peso; score += s; }
    criteriosEval[criterio.id] = { status, comentario };

    if (!criterio.soloDescarte && status === "no_cumple" && ["formacion", "ubicacion", "habilidad_indispensable"].includes(criterio.categoria)) {
      riesgos.push(comentarioGenerico(criterio.label, "no_cumple"));
    }

    if (criterio.descarteSi && status === criterio.descarteSi) {
      const anuladoPor = criterio.anularSiCumpleId && criteriosEval[criterio.anularSiCumpleId];
      const anulado = anuladoPor && anuladoPor.status === "cumple";
      if (!anulado) { descarte = true; if (criterio.descarteMensaje) riesgos.unshift(criterio.descarteMensaje); }
    }
  });

  let compatibilidad = maxScore > 0 ? Math.round((score / maxScore) * 100) : 0;
  compatibilidad = Math.max(0, Math.min(100, compatibilidad));
  if (descarte) compatibilidad = Math.min(compatibilidad, 20);

  let estado;
  if (descarte) estado = "baja";
  else if (compatibilidad >= 85) estado = "muy_recomendado";
  else if (compatibilidad >= 70) estado = "recomendado";
  else if (compatibilidad >= 50) estado = "revisar";
  else estado = "baja";

  const formEval = criteriosEval.formacion;
  const ubiEval = criteriosEval.ubicacion;
  const resumen = [
    formEval ? (formEval.status === "cumple" ? "Cuenta con la formación requerida." : formEval.status === "parcial" ? "Formación parcialmente alineada; revisar manualmente." : "No se confirmó la formación requerida en el texto del CV.") : "",
    ubiEval ? (ubiEval.status === "cumple" ? "Reside en CDMX o zona conurbada." : "No se confirmó residencia en CDMX o zona conurbada.") : "",
    descarte ? "Se detectó al menos un criterio de descarte para esta vacante." : "",
  ].filter(Boolean).join(" ");

  const recomendacion = descarte
    ? "Este perfil cumple con uno o más criterios de descarte definidos para la vacante; no se recomienda continuar el proceso."
    : estado === "muy_recomendado" ? "Perfil altamente alineado con la vacante. Se recomienda avanzar a entrevista."
    : estado === "recomendado" ? "Buen encaje general con la vacante. Se recomienda considerar para entrevista."
    : estado === "revisar" ? "Encaje parcial o con datos insuficientes; conviene revisar manualmente antes de decidir."
    : "El perfil se aleja de forma importante de los requisitos de la vacante.";

  return {
    id: `${fileName}-${norm.length}`, nombre, archivo: fileName, compatibilidad, estado, resumen, recomendacion, riesgos, criteriosEval,
    salarioSolicitado: salarioManual || null, experienciaAnios: experienciaAniosDetectados,
  };
}

function ScanMeter({ value }) {

function Stepper({ step }) {

function PasoCandidatos({ vacante, files, setFiles, salarios, setSalarios, onBack, onAnalyze, isAnalyzing, progress, pdfStatus }) {
  const [isDragging, setIsDragging] = useState(false);

  const addFiles = useCallback((fileList) => {
    const nuevos = Array.from(fileList).filter((f) => f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf"));
    setFiles((prev) => {
      const existentes = new Set(prev.map((f) => f.name + f.size));
      const filtrados = nuevos.filter((f) => !existentes.has(f.name + f.size));
      return [...prev, ...filtrados];
    });
  }, [setFiles]);

  const handleDrop = (e) => {
    e.preventDefault();
    setIsDragging(false);
    if (e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  };

  const removeFile = (idx) => setFiles((prev) => prev.filter((_, i) => i !== idx));

  return (
    <div className="ts-fade-in">
      <div className="ts-card">
        <div className="ts-card-title"><Icon name="upload" size={16} /> Sube los CVs en PDF para la vacante: {vacante.titulo}</div>

        <div
          className={`ts-dropzone ${isDragging ? "is-dragging" : ""}`}
          onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
          onDragLeave={() => setIsDragging(false)}
          onDrop={handleDrop}
          onClick={() => document.getElementById("ts-file-input").click()}
        >
          <Icon name="upload" size={28} style={{ opacity: 0.55 }} />
          <p className="ts-body" style={{ margin: "8px 0 2px" }}>Arrastra los archivos aquí o haz clic para seleccionarlos</p>
          <p className="ts-muted-sm">Solo PDF con texto seleccionable · puedes subir varios a la vez</p>
          <input id="ts-file-input" type="file" accept="application/pdf" multiple style={{ display: "none" }} onChange={(e) => e.target.files && addFiles(e.target.files)} />
        </div>

        {files.length > 0 && (
          <div className="ts-file-list">
            {files.map((f, i) => {
              const key = f.name + f.size;
              return (
                <div className="ts-file-row" key={key}>
                  <Icon name="filetext" size={16} style={{ opacity: 0.6, flexShrink: 0 }} />
                  <span className="ts-file-name">{f.name}</span>
                  <span className="ts-muted-sm">{(f.size / 1024).toFixed(0)} KB</span>
                  <div className="ts-salario-mini">
                    <span className="ts-muted-sm">Pretensión $</span>
                    <input type="number" placeholder="opcional" value={salarios[key] || ""} onChange={(e) => setSalarios((prev) => ({ ...prev, [key]: e.target.value ? Number(e.target.value) : undefined }))} />
                  </div>
                  <button className="ts-icon-btn" onClick={() => removeFile(i)} aria-label={`Quitar ${f.name}`}><Icon name="x" size={14} /></button>
                </div>
              );
            })}
          </div>
        )}

        {pdfStatus === "error" && (
          <div className="ts-notice ts-notice--warn">
            No se pudo cargar el lector de PDF (revisa tu conexión a internet), así que no es posible analizar automáticamente. Puedes reintentar recargando la página.
          </div>
        )}

        {isAnalyzing && (
          <div style={{ marginTop: 16 }}>
            <div className="ts-progress-track"><div className="ts-progress-fill" style={{ width: `${progress}%` }} /></div>
            <p className="ts-muted-sm" style={{ marginTop: 6 }}>Leyendo y analizando candidatos contra el perfil de {vacante.titulo}… {progress}%</p>
          </div>
        )}
      </div>

      <div className="ts-actions-between">
        <button className="ts-btn ts-btn--ghost" onClick={onBack} disabled={isAnalyzing}><Icon name="arrowleft" size={16} /> Volver a la vacante</button>
        <button className="ts-btn ts-btn--primary" onClick={onAnalyze} disabled={files.length === 0 || isAnalyzing || pdfStatus !== "listo"}>
          {pdfStatus === "cargando" ? (
            <><Icon name="loader" size={16} style={{ animation: "tsSpin 0.9s linear infinite" }} /> Cargando lector de PDF…</>
          ) : (
            <><Icon name="scan" size={16} />{isAnalyzing ? "Analizando…" : `Analizar ${files.length || ""} candidato${files.length === 1 ? "" : "s"}`}</>
          )}
        </button>
      </div>
    </div>
  );
}

/* ----------------------------------------------------------------------- */
/* UI: PASO 3 — RESULTADOS                                                 */
/* ----------------------------------------------------------------------- */

function DetalleCandidato({ candidato, vacante }) {
  if (candidato.sinTexto) {
    return <div className="ts-detalle"><div className="ts-detalle-col" style={{ gridColumn: "1 / -1" }}><p className="ts-body">{candidato.resumen}</p></div></div>;
  }
  const criteriosVisibles = vacante.criterios.filter((c) => !c.soloDescarte);
  return (
    <div className="ts-detalle">
      <div className="ts-detalle-col">
        <div className="ts-detalle-heading">Evaluación por criterio</div>
        <div className="ts-criterios">
          {criteriosVisibles.map((c) => {
            const ev = candidato.criteriosEval[c.id];
            if (!ev) return null;
            return (
              <div className="ts-criterio-row" key={c.id}>
                <CriterioIcon status={ev.status} />
                <div><div className="ts-criterio-label">{c.label}</div><div className="ts-muted-sm">{ev.comentario}</div></div>
              </div>
            );
          })}
        </div>
      </div>
      <div className="ts-detalle-col">
        <div className="ts-detalle-heading">Riesgos detectados</div>
        {candidato.riesgos.length === 0 ? (
          <p className="ts-muted-sm">No se detectaron riesgos relevantes.</p>
        ) : (
          <ul className="ts-riesgos">
            {candidato.riesgos.map((r, i) => (
              <li key={i}><Icon name="alert" size={14} style={{ color: "#B4740E", flexShrink: 0, marginTop: 2 }} /><span>{r}</span></li>
            ))}
          </ul>
        )}
        <div className="ts-detalle-heading" style={{ marginTop: 18 }}>Recomendación final</div>
        <p className="ts-body">{candidato.recomendacion}</p>
      </div>
    </div>
  );
}

function CandidatoCard({ candidato, vacante, expanded, onToggle }) {
  return (
    <div className="ts-card ts-candidato-card">
      <button className="ts-candidato-header" onClick={onToggle}>
        <div className="ts-candidato-main">
          <div className="ts-avatar">{candidato.nombre.charAt(0)}</div>
          <div><div className="ts-candidato-nombre">{candidato.nombre}</div><div className="ts-muted-sm">{candidato.archivo}</div></div>
        </div>
        <div className="ts-candidato-right">
          <EstadoBadge estado={candidato.estado} />
          <ScanMeter value={candidato.compatibilidad} />
          {expanded ? <Icon name="chevrondown" size={18} /> : <Icon name="chevronright" size={18} />}
        </div>
      </button>
      <p className="ts-body ts-resumen">{candidato.resumen}</p>
      {expanded && <DetalleCandidato candidato={candidato} vacante={vacante} />}
    </div>
  );
}

function PasoResultados({ vacante, candidatos, onBack, onReiniciar }) {
  const [filtro, setFiltro] = useState("todos");
  const [expandedId, setExpandedId] = useState(null);

  const filtrados = useMemo(() => {
    const base = filtro === "todos" ? candidatos : candidatos.filter((c) => c.estado === filtro);
    return [...base].sort((a, b) => {
      const va = a.compatibilidad === null || a.compatibilidad === undefined ? -1 : a.compatibilidad;
      const vb = b.compatibilidad === null || b.compatibilidad === undefined ? -1 : b.compatibilidad;
      return vb - va;
    });
  }, [candidatos, filtro]);

  const conteos = useMemo(() => {
    const c = { muy_recomendado: 0, recomendado: 0, revisar: 0, baja: 0 };
    candidatos.forEach((cand) => (c[cand.estado] += 1));
    return c;
  }, [candidatos]);

  return (
    <div className="ts-fade-in">
      <div className="ts-resultados-header">
        <div>
          <h2 className="ts-h2" style={{ marginBottom: 2 }}>Ranking de candidatos</h2>
          <p className="ts-muted-sm">{candidatos.length} candidato{candidatos.length === 1 ? "" : "s"} evaluado{candidatos.length === 1 ? "" : "s"} contra el perfil de {vacante.titulo}</p>
        </div>
        <button className="ts-btn ts-btn--ghost" onClick={onReiniciar}>Nuevo análisis</button>
      </div>

      <div className="ts-filtros">
        <Icon name="sliders" size={14} style={{ opacity: 0.5 }} />
        {[
          { id: "todos", label: `Todos (${candidatos.length})` },
          { id: "muy_recomendado", label: `Muy recomendado (${conteos.muy_recomendado})` },
          { id: "recomendado", label: `Recomendado (${conteos.recomendado})` },
          { id: "revisar", label: `Revisar (${conteos.revisar})` },
          { id: "baja", label: `Baja compatibilidad (${conteos.baja})` },
        ].map((f) => (
          <button key={f.id} className={`ts-filtro-chip ${filtro === f.id ? "is-active" : ""}`} onClick={() => setFiltro(f.id)}>{f.label}</button>
        ))}
      </div>

      <div className="ts-candidatos-list">
        {filtrados.map((c) => (
          <CandidatoCard key={c.id} candidato={c} vacante={vacante} expanded={expandedId === c.id} onToggle={() => setExpandedId(expandedId === c.id ? null : c.id)} />
        ))}
        {filtrados.length === 0 && <div className="ts-card" style={{ textAlign: "center", color: "var(--ts-muted)" }}>No hay candidatos en este filtro.</div>}
      </div>

      <div className="ts-actions-left">
        <button className="ts-btn ts-btn--ghost" onClick={onBack}><Icon name="arrowleft" size={16} /> Volver a candidatos</button>
      </div>
    </div>
  );
}

/* ----------------------------------------------------------------------- */
/* APP PRINCIPAL                                                           */
/* ----------------------------------------------------------------------- */

function TalentScan() {
  const [step, setStep] = useState(1);
  const [vacantes, setVacantes] = useState(VACANTES_INICIALES);
  const [vacanteActivaId, setVacanteActivaId] = useState("editor_web");
  const [files, setFiles] = useState([]);
  const [salarios, setSalarios] = useState({});
  const [candidatos, setCandidatos] = useState([]);
  const [vacanteEvaluada, setVacanteEvaluada] = useState(null);
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [progress, setProgress] = useState(0);
  const pdfStatus = usePdfJs();

  useEffect(() => {
    fetch("./vacantes.json")
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((data) => {
        if (data && Object.keys(data).length) {
          setVacantes(data);
          setVacanteActivaId(Object.keys(data)[0]);
        }
      })
      .catch(() => {});
  }, []);

  const vacanteActiva = vacantes[vacanteActivaId];

  const analizar = async () => {
    setIsAnalyzing(true);
    setProgress(0);
    const resultados = [];
    const vacanteUsada = vacanteActiva;

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      const key = f.name + f.size;
      try {
        const texto = await extraerTextoPDF(f);
        resultados.push(analizarCandidatoPorCoincidencias({ textoOriginal: texto, fileName: f.name, vacante: vacanteUsada, salarioManual: salarios[key] }));
      } catch (e) {
        resultados.push(analizarCandidatoPorCoincidencias({ textoOriginal: "", fileName: f.name, vacante: vacanteUsada, salarioManual: salarios[key] }));
      }
      setProgress(Math.round(((i + 1) / files.length) * 100));
    }

    setCandidatos(resultados);
    setVacanteEvaluada(vacanteUsada);
    setIsAnalyzing(false);
    setStep(3);
  };

  const reiniciar = () => {
    setFiles([]);
    setSalarios({});
    setCandidatos([]);
    setStep(2);
  };

  return (
    <div className="ts-root">
      <div className="ts-shell">
        <div className="ts-brand">
          <div className="ts-brand-icon"><Icon name="scan" size={24} /></div>
          <div>
            <div className="ts-brand-name">Talent Scan <span className="ts-brand-org">REFORMA</span></div>
            <span className="ts-version-badge">v{VERSION}</span>
          </div>
        </div>

        <Stepper step={step} />

        {step === 1 && <PasoVacante vacantes={vacantes} vacanteActivaId={vacanteActivaId} setVacanteActivaId={setVacanteActivaId} onNext={() => setStep(2)} />}
        {step === 2 && (
          <PasoCandidatos vacante={vacanteActiva} files={files} setFiles={setFiles} salarios={salarios} setSalarios={setSalarios} onBack={() => setStep(1)} onAnalyze={analizar} isAnalyzing={isAnalyzing} progress={progress} pdfStatus={pdfStatus} />
        )}
        {step === 3 && <PasoResultados vacante={vacanteEvaluada} candidatos={candidatos} onBack={() => setStep(2)} onReiniciar={reiniciar} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TalentScan />);
</script>
</body>
</html>
