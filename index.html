<script type="text/babel">
/**
 * ============================================================================
 * TALENT SCAN REFORMA — index.html (vista para RH, SOLO LECTURA)
 * ============================================================================
 * v1.0 — Arquitectura de puntaje nueva:
 *
 * - REQUISITOS (formación, ubicación, portafolio...): NO dan ni quitan
 *   puntos. Si falta uno, se marca como riesgo/verificar, pero nunca
 *   descartan por sí solos: si el resto del perfil (habilidades) es
 *   fuerte, el candidato cae en "Interesante - verificar", no en
 *   "Baja compatibilidad".
 *
 * - HABILIDADES INDISPENSABLES: son las que SÍ definen el % de
 *   compatibilidad. Cada vacante tiene un "presupuesto" total (ej. 100)
 *   que se reparte automáticamente entre todas las habilidades
 *   indispensables que tenga esa vacante - si agregas o quitas una, el
 *   reparto se ajusta solo, sin tocar números manualmente.
 *
 * - DESEABLES: funcionan como bono. Tienen su propio presupuesto (ej. 20)
 *   que se SUMA encima del % de indispensables si el candidato las
 *   tiene - nunca restan si no las tiene.
 *
 * - CRITERIOS DE DESCARTE (becario, creador de contenido para redes,
 *   branded content, área no relacionada): esto es distinto a
 *   "requisito". Aquí se detectó algo que SÍ contradice el puesto - esto
 *   sigue descartando directo, sin excepción, sin importar el resto del
 *   puntaje.
 *
 * - Sin salario: se quitó por completo (ni puntos, ni captura, ni se
 *   muestra) - es información pública en vacantes.json y no debía
 *   estar ahí.
 * ============================================================================
 */

const VERSION = "1.3";
const UMBRAL_INTERESANTE = 80;

const { useState, useCallback, useMemo, useEffect } = React;

/* ÍCONOS                                                                   */
/* ----------------------------------------------------------------------- */

    case "sliders": return <svg {...common}><line x1="4" y1="7" x2="20" y2="7" /><circle cx="9" cy="7" r="1.6" fill="currentColor" stroke="none" /><line x1="4" y1="17" x2="20" y2="17" /><circle cx="16" cy="17" r="1.6" fill="currentColor" stroke="none" /></svg>;

    default: return null;
  }
}

/* ----------------------------------------------------------------------- */
/* UTILIDADES DE TEXTO                                                     */
/* ----------------------------------------------------------------------- */

function normalizar(str) {
  return (str || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
}
function matchAny(text, keywords) {
  return (keywords || []).some((k) => {
    const n = normalizar(k).trim();
    return n && text.includes(n);
  });
}
function nombreDesdeArchivo(fileName) {
  const sinExtension = fileName.replace(/\.[^/.]+$/, "");
  const limpio = sinExtension.replace(/[_\-]+/g, " ").replace(/\s+/g, " ").trim();
  return limpio.split(" ").map((w) => (w.length ? w[0].toUpperCase() + w.slice(1).toLowerCase() : w)).join(" ");
}
function extraerNombreProbable(textoOriginal, fileName) {
  const primeraLinea = (textoOriginal || "").split("\n").map((l) => l.trim()).find((l) => l.length > 0);
  if (primeraLinea && primeraLinea.length >= 4 && primeraLinea.length <= 45) {
    const palabras = primeraLinea.split(/\s+/);
    const pareceNombre = palabras.length >= 2 && palabras.length <= 4 && /^[A-Za-zÀ-ÿ.\s]+$/.test(primeraLinea) && !/curriculum|resume|cv\b/i.test(primeraLinea);
    if (pareceNombre) return primeraLinea;
  }
  return nombreDesdeArchivo(fileName);
}
function extraerAniosExperiencia(normText) {
  const matches = [...normText.matchAll(/(\d{1,2})\s*\+?\s*(?:anos|ano)\b/g)];
  const info = matches.map((m) => {
    const antes = normText.slice(Math.max(0, m.index - 40), m.index);
    const despues = normText.slice(m.index + m[0].length, m.index + m[0].length + 20);
    const esEdad = /(edad|tengo|nacimiento)\W*$/.test(antes) || /^\s*(de\s+edad|cumplidos)/.test(despues);
    const cercaExp = normText.slice(Math.max(0, m.index - 50), m.index + m[0].length + 50).includes("experiencia");
    return { n: parseInt(m[1], 10), esEdad, cercaExp };
  }).filter((x) => x.n > 0 && x.n < 40 && !x.esEdad);
  if (!info.length) return null;
  const conExp = info.filter((x) => x.cercaExp);
  return Math.max(...(conExp.length ? conExp : info).map((x) => x.n));
}
function comentarioGenerico(label, status) {
  if (status === "cumple") return `Se detectó "${label}" en el texto del CV.`;
  if (status === "parcial") return `Se encontró una coincidencia parcial relacionada con "${label}".`;
  return `No se detectó "${label}" en el texto del CV.`;
}
function fechaAmigable(fechaIso) {
  if (!fechaIso) return "sin fecha";
  const d = new Date(fechaIso);
  if (isNaN(d.getTime())) return fechaIso;
  const fecha = d.toLocaleDateString("es-MX", { day: "numeric", month: "long", year: "numeric" });
  const hora = d.toLocaleTimeString("es-MX", { hour: "2-digit", minute: "2-digit" });
  return `${fecha}, ${hora}`;
}

/* EXTRACCIÓN DE TEXTO DEL PDF (PDF.js, cargado dinámicamente)             */
/* ----------------------------------------------------------------------- */

const PDFJS_BASE = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174";

function usePdfJs() {
  const [status, setStatus] = useState("cargando");
  useEffect(() => {
    if (window.pdfjsLib) { setStatus("listo"); return; }
    const script = document.createElement("script");
    script.src = `${PDFJS_BASE}/pdf.min.js`;
    script.async = true;
    script.onload = async () => {
      try {
        const workerCode = await fetch(`${PDFJS_BASE}/pdf.worker.min.js`).then((r) => r.text());
        const blob = new Blob([workerCode], { type: "application/javascript" });
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(blob);
        setStatus("listo");
      } catch (e) { setStatus("error"); }
    };
    script.onerror = () => setStatus("error");
    document.body.appendChild(script);
  }, []);
  return status;
}

async function extraerTextoPDF(file) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await window.pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  let texto = "";
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    texto += content.items.map((it) => it.str).join(" ") + "\n";
  }
  return texto;
}

/* MOTOR DE ANÁLISIS                                                        */
/* ----------------------------------------------------------------------- */

function analizarCandidatoPorCoincidencias({ textoOriginal, fileName, vacante }) {
  const norm = normalizar(textoOriginal);
  const tieneTexto = norm.trim().length > 40;

  if (!tieneTexto) {
    return {
      id: fileName, nombre: nombreDesdeArchivo(fileName), archivo: fileName, sinTexto: true,
      compatibilidad: null, estado: "revisar",
      resumen: "No fue posible extraer texto de este PDF (probablemente es un documento escaneado o basado en imágenes). Se necesita revisión manual.",
      recomendacion: "Revisión manual requerida: el sistema no pudo leer el contenido del archivo.",
      riesgos: ["No se pudo extraer texto del PDF."], criteriosEval: {}, experienciaAnios: null,
    };
  }

  const nombre = extraerNombreProbable(textoOriginal, fileName);
  const riesgos = [];
  const criteriosEval = {};
  let descarteDuro = false;
  let experienciaAniosDetectados = null;

  const indispensables = vacante.criterios.filter((c) => c.categoria === "habilidad_indispensable");
  const deseables = vacante.criterios.filter((c) => c.categoria === "habilidad_deseable");
  const presupuestoIndispensables = vacante.presupuestoIndispensables || 100;
  const presupuestoDeseables = vacante.presupuestoDeseables || 0;
  const shareIndispensable = indispensables.length > 0 ? presupuestoIndispensables / indispensables.length : 0;
  const shareDeseable = deseables.length > 0 ? presupuestoDeseables / deseables.length : 0;

  let scoreIndispensable = 0;
  let scoreDeseable = 0;
  const requisitosFaltantes = [];

  vacante.criterios.forEach((criterio) => {
    if (criterio.tipo === "areaNoRelacionada") {
      const disparado = matchAny(norm, criterio.keywords) && !matchAny(norm, criterio.keywordsExcluyentes);
      if (disparado) { descarteDuro = true; riesgos.unshift(criterio.descarteMensaje); }
      return;
    }

    const esIndispensable = criterio.categoria === "habilidad_indispensable";
    const esDeseable = criterio.categoria === "habilidad_deseable";
    const esRequisito = criterio.categoria === "requisito";
    const pesoEfectivo = esIndispensable ? shareIndispensable : esDeseable ? shareDeseable : 0;

    let status, s, comentario;

    if (criterio.tipo === "keyword") {
      const ok = matchAny(norm, criterio.keywords);
      const parcialOk = !ok && criterio.keywordsParcial ? matchAny(norm, criterio.keywordsParcial) : false;
      status = ok ? "cumple" : parcialOk ? "parcial" : "no_cumple";
      s = ok ? pesoEfectivo : parcialOk ? pesoEfectivo * 0.5 : 0;
      comentario = comentarioGenerico(criterio.label, status);
    } else if (criterio.tipo === "url") {
      const urlRegex = /https?:\/\/|www\.|behance|dribbble/;
      const ok = urlRegex.test(norm) || matchAny(norm, criterio.keywords);
      status = ok ? "cumple" : "no_cumple";
      s = ok ? pesoEfectivo : 0;
      comentario = comentarioGenerico(criterio.label, status);
    } else if (criterio.tipo === "anios") {
      const anios = extraerAniosExperiencia(norm);
      experienciaAniosDetectados = anios;
      if (anios === null) {
        status = "parcial"; s = pesoEfectivo * 0.45;
        comentario = "No se pudo determinar automáticamente los años de experiencia; revisar manualmente.";
      } else if (anios >= criterio.anioMin && anios <= criterio.anioMax) {
        status = "cumple"; s = pesoEfectivo;
        comentario = `${anios} año(s) de experiencia detectados, dentro del rango ideal.`;
      } else if (anios < criterio.anioMin) {
        status = "no_cumple"; s = Math.max(pesoEfectivo * (anios / Math.max(criterio.anioMin, 1)) * 0.5, 0);
        comentario = "Experiencia detectada por debajo del mínimo requerido.";
      } else {
        const exceso = anios - criterio.anioMax;
        status = "parcial"; s = Math.max(pesoEfectivo - 2 * exceso, pesoEfectivo * 0.4);
        comentario = `${anios} año(s) de experiencia detectados (fuera del rango ideal de ${criterio.anioMin} a ${criterio.anioMax}).`;
      }
    }

    criteriosEval[criterio.id] = { status, comentario };
    if (esIndispensable) scoreIndispensable += s;
    if (esDeseable) scoreDeseable += s;

    if (esRequisito && status === "no_cumple") {
      requisitosFaltantes.push(criterio);
      riesgos.push(comentarioGenerico(criterio.label, "no_cumple"));
    }

    if (criterio.descarteSi && status === criterio.descarteSi) {
      const anuladoPor = criterio.anularSiCumpleId && criteriosEval[criterio.anularSiCumpleId];
      const anulado = anuladoPor && anuladoPor.status === "cumple";
      if (!anulado) {
        descarteDuro = true;
        if (criterio.descarteMensaje) riesgos.unshift(criterio.descarteMensaje);
      }
    }
  });

  const baseIndispensable = presupuestoIndispensables > 0 && indispensables.length > 0
    ? (scoreIndispensable / presupuestoIndispensables) * 100
    : 0;
  let compatibilidad = Math.round(Math.max(0, Math.min(100, baseIndispensable + scoreDeseable)));

  let estado;
  if (descarteDuro) {
    compatibilidad = Math.min(compatibilidad, 20);
    estado = "baja";
  } else if (requisitosFaltantes.length > 0 && compatibilidad >= UMBRAL_INTERESANTE) {
    estado = "interesante";
  } else {
    estado = compatibilidad >= 85 ? "muy_recomendado" : compatibilidad >= 70 ? "recomendado" : compatibilidad >= 50 ? "revisar" : "baja";
  }

  const reqLabels = requisitosFaltantes.map((r) => r.label).join(", ");
  const resumen = [
    `Compatibilidad de habilidades: ${compatibilidad}%.`,
    requisitosFaltantes.length > 0 ? `Falta confirmar: ${reqLabels}.` : "",
    descarteDuro ? "Se detectó un criterio de descarte para esta vacante." : "",
  ].filter(Boolean).join(" ");

  const recomendacion = descarteDuro
    ? "Este perfil cumple con uno o más criterios de descarte definidos para la vacante; no se recomienda continuar el proceso."
    : estado === "interesante"
    ? `Buen dominio de las habilidades del puesto (${compatibilidad}%), pero no se pudo confirmar automáticamente: ${reqLabels}. Se recomienda verificar directamente con el candidato o consultar con el jefe de área antes de descartarlo.`
    : estado === "muy_recomendado" ? "Perfil altamente alineado con la vacante. Se recomienda avanzar a entrevista."
    : estado === "recomendado" ? "Buen encaje general con la vacante. Se recomienda considerar para entrevista."
    : estado === "revisar" ? "Encaje parcial; conviene revisar manualmente antes de decidir."
    : "El perfil se aleja de forma importante de los requisitos de la vacante.";

  return {
    id: `${fileName}-${norm.length}`, nombre, archivo: fileName, compatibilidad, estado, resumen, recomendacion, riesgos, criteriosEval,
    experienciaAnios: experienciaAniosDetectados,
  };
}

function EstadoBadge({ estado }) {

function CriterioIcon({ status }) {

}
function CompatRing({ value, estado, size = 42, stroke = 4, fontSize = 11 }) {
  if (value === null) return <span className="ts-muted-sm" style={{ fontSize: 11 }}>—</span>;
  const cfg = estado && ESTADOS[estado] ? ESTADOS[estado] : ESTADOS.revisar;
  const radius = (size - stroke) / 2;
  const circunferencia = 2 * Math.PI * radius;
  const offset = circunferencia * (1 - value / 100);
  return (
    <div className="ts-ring-wrap" style={{ width: size, height: size }}>
      <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
        <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke="var(--ts-border)" strokeWidth={stroke} />
        <circle cx={size / 2} cy={size / 2} r={radius} fill="none" stroke={cfg.color} strokeWidth={stroke} strokeLinecap="round" strokeDasharray={circunferencia} strokeDashoffset={offset} transform={`rotate(-90 ${size / 2} ${size / 2})`} style={{ transition: "stroke-dashoffset 0.6s ease" }} />
      </svg>
      <span className="ts-ring-value" style={{ color: cfg.color, fontSize }}>{value}%</span>
    </div>
  );
}
function Stepper({ step }) {

  );
}

function PasoPrincipal({ vacantes, vacanteActivaId, setVacanteActivaId, files, setFiles, onAnalyze, isAnalyzing, progress, pdfStatus }) {
  const vacante = vacantes[vacanteActivaId];
  const [detallesAbiertos, setDetallesAbiertos] = useState(false);
  const [isDragging, setIsDragging] = useState(false);

  const seleccionarVacante = (id) => {
    if (id === vacanteActivaId) return;
    setVacanteActivaId(id);
    setFiles([]);
  };

  const addFiles = useCallback((fileList) => {
    const nuevos = Array.from(fileList).filter((f) => f.type === "application/pdf" || f.name.toLowerCase().endsWith(".pdf"));
    setFiles((prev) => {
      const existentes = new Set(prev.map((f) => f.name + f.size));
      const filtrados = nuevos.filter((f) => !existentes.has(f.name + f.size));
      return [...prev, ...filtrados];
    });
  }, [setFiles]);

  const handleDrop = (e) => {
    e.preventDefault();
    setIsDragging(false);
    if (e.dataTransfer.files && e.dataTransfer.files.length) addFiles(e.dataTransfer.files);
  };
  const removeFile = (idx) => setFiles((prev) => prev.filter((_, i) => i !== idx));

  return (
    <div className="ts-fade-in">
      <div className="ts-vacante-selector">
        {Object.values(vacantes).map((v) => (
          <button key={v.id} className={`ts-vacante-chip ${v.id === vacanteActivaId ? "is-active" : ""}`} onClick={() => seleccionarVacante(v.id)}>{v.titulo}</button>
        ))}
      </div>

      <div className="ts-card ts-card--hero">
        <div className="ts-eyebrow"><Icon name="briefcase" size={14} /><span>Vacante activa</span></div>
        <h1 className="ts-vacante-titulo-grande">{vacante.titulo}</h1>
        <p className="ts-muted" style={{ maxWidth: 560 }}>{vacante.resumenCorto}</p>
      </div>

      <button className="ts-collapse-btn" onClick={() => setDetallesAbiertos((v) => !v)}>
        <span>Ver detalles completos de la vacante</span>
        <Icon name={detallesAbiertos ? "chevrondown" : "chevronright"} size={16} />
      </button>
      {detallesAbiertos && <ResumenCriterios vacante={vacante} />}

      <div className="ts-card">
        <div className="ts-card-title"><Icon name="upload" size={16} /> Sube los CVs en PDF</div>
        <div className={`ts-dropzone ${isDragging ? "is-dragging" : ""}`} onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }} onDragLeave={() => setIsDragging(false)} onDrop={handleDrop} onClick={() => document.getElementById("ts-file-input").click()}>
          <Icon name="upload" size={28} style={{ opacity: 0.55 }} />
          <p className="ts-body" style={{ margin: "8px 0 2px" }}>Arrastra los archivos aquí o haz clic para seleccionarlos</p>
          <p className="ts-muted-sm">Solo PDF con texto seleccionable · puedes subir varios a la vez</p>
          <input id="ts-file-input" type="file" accept="application/pdf" multiple style={{ display: "none" }} onChange={(e) => e.target.files && addFiles(e.target.files)} />
        </div>

        {files.length > 0 && (
          <div className="ts-file-list">
            {files.map((f, i) => (
              <div className="ts-file-row" key={f.name + f.size}>
                <Icon name="filetext" size={16} style={{ opacity: 0.6, flexShrink: 0 }} />
                <span className="ts-file-name">{f.name}</span>
                <span className="ts-muted-sm">{(f.size / 1024).toFixed(0)} KB</span>
                <button className="ts-icon-btn" onClick={() => removeFile(i)} aria-label={`Quitar ${f.name}`}><Icon name="x" size={14} /></button>
              </div>
            ))}
          </div>
        )}

        {pdfStatus === "error" && (
          <div className="ts-notice ts-notice--warn">No se pudo cargar el lector de PDF (revisa tu conexión a internet). Puedes reintentar recargando la página.</div>
        )}

        {isAnalyzing && (
          <div style={{ marginTop: 16 }}>
            <div className="ts-progress-track"><div className="ts-progress-fill" style={{ width: `${progress}%` }} /></div>
            <p className="ts-muted-sm" style={{ marginTop: 6 }}>Leyendo y analizando candidatos contra el perfil de {vacante.titulo}… {progress}%</p>
          </div>
        )}
      </div>

      <div className="ts-actions-right">
        <button className="ts-btn ts-btn--primary" onClick={onAnalyze} disabled={files.length === 0 || isAnalyzing || pdfStatus !== "listo"}>
          {pdfStatus === "cargando" ? (
            <><Icon name="loader" size={16} style={{ animation: "tsSpin 0.9s linear infinite" }} /> Cargando lector de PDF…</>
          ) : (
            <><Icon name="scan" size={16} />{isAnalyzing ? "Analizando…" : `Analizar ${files.length || ""} candidato${files.length === 1 ? "" : "s"}`}</>
          )}
        </button>
      </div>
    </div>
  );
}

/* ----------------------------------------------------------------------- */
/* PASO 2 — RESULTADOS                                                     */
/* ----------------------------------------------------------------------- */

function accionSugerida(estado) {
  if (estado === "muy_recomendado") return "Entrevistar";
  if (estado === "recomendado") return "Considerar para entrevista";
  if (estado === "interesante") return "Confirmar con el candidato o el jefe de área";
  if (estado === "revisar") return "Revisar manualmente";
  return "No se recomienda continuar";
}

function RequisitosResumen({ candidato, vacante }) {
  const requisitos = vacante.criterios.filter((c) => c.categoria === "requisito");
  if (requisitos.length === 0) return null;
  return (
    <div className="ts-mini-card">
      <div className="ts-mini-card-title"><Icon name="shield" size={13} /> Requisitos</div>
      <div className="ts-criterios">
        {requisitos.map((c) => {
          const ev = candidato.criteriosEval[c.id];
          if (!ev) return null;
          return (
            <div className="ts-criterio-row" key={c.id}>
              <CriterioIcon status={ev.status} />
              <div><div className="ts-criterio-label">{c.label}</div><div className="ts-muted-sm">{ev.comentario}</div></div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function CaracteristicasDetectadas({ candidato, vacante }) {
  const features = vacante.criterios.filter((c) => c.categoria === "feature");
  if (features.length === 0) return null;
  const detectadas = features.filter((c) => candidato.criteriosEval[c.id] && candidato.criteriosEval[c.id].status === "cumple");
  return (
    <div className="ts-mini-card">
      <div className="ts-mini-card-title"><Icon name="sparkles" size={13} /> Características detectadas (no puntúan)</div>
      {detectadas.length === 0 ? (
        <p className="ts-muted-sm">No se detectó ninguna en el texto del CV.</p>
      ) : (
        <div className="ts-chip-row">{detectadas.map((c) => <span className="ts-chip ts-chip--soft" key={c.id}>{c.label}</span>)}</div>
      )}
    </div>
  );
}

function EvaluacionCriterios({ candidato, vacante }) {
  const [abierto, setAbierto] = useState(false);
  const habilidades = vacante.criterios.filter((c) => c.categoria === "habilidad_indispensable" || c.categoria === "habilidad_deseable");
  const filas = habilidades.map((c) => ({ c, ev: candidato.criteriosEval[c.id] })).filter((x) => x.ev);
  const coinciden = filas.filter((x) => x.ev.status === "cumple");
  const noCoinciden = filas.filter((x) => x.ev.status !== "cumple");

  return (
    <div className="ts-mini-card">
      <button className="ts-eval-toggle" onClick={() => setAbierto((v) => !v)}>
        <span className="ts-mini-card-title" style={{ marginBottom: 0 }}><Icon name="sliders" size={13} /> Evaluación de habilidades</span>
        <Icon name={abierto ? "chevrondown" : "chevronright"} size={15} />
      </button>
      {abierto && (
        <div style={{ marginTop: 12 }}>
          <div className="ts-eval-subheading" style={{ color: "#15803D" }}><Icon name="check" size={13} /> Coinciden ({coinciden.length})</div>
          {coinciden.length === 0 ? <p className="ts-muted-sm" style={{ marginBottom: 14 }}>Ninguna.</p> : (
            <div className="ts-criterios" style={{ marginBottom: 14 }}>
              {coinciden.map(({ c, ev }) => (
                <div className="ts-criterio-row" key={c.id}><CriterioIcon status={ev.status} /><div><div className="ts-criterio-label">{c.label}</div><div className="ts-muted-sm">{ev.comentario}</div></div></div>
              ))}
            </div>
          )}
          <div className="ts-eval-subheading" style={{ color: "#DC2626" }}><Icon name="xcircle" size={13} /> No coinciden ({noCoinciden.length})</div>
          {noCoinciden.length === 0 ? <p className="ts-muted-sm">Ninguna.</p> : (
            <div className="ts-criterios">
              {noCoinciden.map(({ c, ev }) => (
                <div className="ts-criterio-row" key={c.id}><CriterioIcon status={ev.status} /><div><div className="ts-criterio-label">{c.label}</div><div className="ts-muted-sm">{ev.comentario}</div></div></div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function DetalleContenido({ candidato, vacante }) {
  const cfg = candidato.compatibilidad === null ? { color: "var(--ts-muted)" } : (ESTADOS[candidato.estado] || ESTADOS.revisar);
  return (
    <div className="ts-detalle-inline">
      <div className="ts-mini-card">
        <div className="ts-mini-card-title"><Icon name="sparkles" size={13} /> Resumen</div>
        <p className="ts-body">{candidato.resumen}</p>
      </div>

      {!candidato.sinTexto && <RequisitosResumen candidato={candidato} vacante={vacante} />}

      {!candidato.sinTexto && (
        <div className="ts-mini-card">
          <div className="ts-mini-card-title"><Icon name="check" size={13} /> Recomendación</div>
          <div className="ts-accion-sugerida" style={{ color: cfg.color }}>{accionSugerida(candidato.estado)}</div>
          <p className="ts-body ts-muted">{candidato.recomendacion}</p>
        </div>
      )}

      <div className="ts-mini-card">
        <div className="ts-mini-card-title"><Icon name="alert" size={13} /> Riesgos detectados</div>
        {candidato.riesgos.length === 0 ? <p className="ts-muted-sm">No se detectaron riesgos relevantes.</p> : (
          <ul className="ts-riesgos">{candidato.riesgos.map((r, i) => <li key={i}><Icon name="alert" size={14} style={{ color: "#FF9500", flexShrink: 0, marginTop: 2 }} /><span>{r}</span></li>)}</ul>
        )}
      </div>

      {!candidato.sinTexto && <EvaluacionCriterios candidato={candidato} vacante={vacante} />}
      {!candidato.sinTexto && <CaracteristicasDetectadas candidato={candidato} vacante={vacante} />}
    </div>
  );
}

const PAGE_SIZE = 8;

function PasoResultados({ vacante, candidatos, onBack, onReiniciar }) {
  const [filtro, setFiltro] = useState("todos");
  const [busqueda, setBusqueda] = useState("");
  const [pagina, setPagina] = useState(1);
  const [expandedId, setExpandedId] = useState(null);

  const ordenados = useMemo(() => {
    return [...candidatos].sort((a, b) => {
      const va = a.compatibilidad === null || a.compatibilidad === undefined ? -1 : a.compatibilidad;
      const vb = b.compatibilidad === null || b.compatibilidad === undefined ? -1 : b.compatibilidad;
      return vb - va;
    });
  }, [candidatos]);

  useEffect(() => { if (ordenados.length > 0) setExpandedId(ordenados[0].id); }, [vacante]);

  const conteos = useMemo(() => {
    const c = { muy_recomendado: 0, recomendado: 0, interesante: 0, revisar: 0, baja: 0 };
    candidatos.forEach((cand) => (c[cand.estado] += 1));
    return c;
  }, [candidatos]);

  const filtrados = useMemo(() => {
    let base = filtro === "todos" ? ordenados : ordenados.filter((c) => c.estado === filtro);
    if (busqueda.trim()) {
      const q = normalizar(busqueda);
      base = base.filter((c) => normalizar(c.nombre).includes(q) || normalizar(c.archivo).includes(q));
    }
    return base;
  }, [ordenados, filtro, busqueda]);

  const totalPaginas = Math.max(1, Math.ceil(filtrados.length / PAGE_SIZE));
  const paginaSegura = Math.min(pagina, totalPaginas);
  const visibles = filtrados.slice((paginaSegura - 1) * PAGE_SIZE, paginaSegura * PAGE_SIZE);

  return (
    <div className="ts-fade-in">
      <div className="ts-resultados-header">
        <div className="ts-resultados-titulo">
          <h2 className="ts-h2" style={{ margin: 0, fontSize: 22, fontWeight: 700 }}>Resultados — {vacante.titulo} <span className="ts-count-pill">{candidatos.length} analizados</span></h2>
        </div>
        <button className="ts-btn ts-btn--ghost" onClick={onReiniciar}>Nuevo análisis</button>
      </div>

      <div className="ts-filtros">
        {[
          { id: "todos", label: `Todos (${candidatos.length})` },
          { id: "muy_recomendado", label: `Muy recomendados (${conteos.muy_recomendado})` },
          { id: "recomendado", label: `Recomendados (${conteos.recomendado})` },
          { id: "interesante", label: `Interesantes — verificar (${conteos.interesante})` },
          { id: "revisar", label: `Revisar (${conteos.revisar})` },
          { id: "baja", label: `Baja compatibilidad (${conteos.baja})` },
        ].map((f) => (
          <button key={f.id} className={`ts-filtro-chip ${filtro === f.id ? "is-active" : ""}`} onClick={() => { setFiltro(f.id); setPagina(1); }}>{f.label}</button>
        ))}
      </div>

      <div className="ts-search-row">
        <div className="ts-search-input">
          <span className="ts-search-icon"><Icon name="search" size={14} /></span>
          <input placeholder="Buscar candidato…" value={busqueda} onChange={(e) => { setBusqueda(e.target.value); setPagina(1); }} />
        </div>
      </div>

      <div className="ts-tabla-header"><span>#</span><span>Candidato</span><span>Compat.</span><span>Estado</span><span>Exp.</span><span></span></div>

      {visibles.map((c, i) => {
        const cfg = c.estado ? ESTADOS[c.estado] : null;
        const rank = (paginaSegura - 1) * PAGE_SIZE + i + 1;
        const abierto = expandedId === c.id;
        return (
          <React.Fragment key={c.id}>
            <button className={`ts-fila-candidato ${abierto ? "is-selected" : ""}`} onClick={() => setExpandedId(abierto ? null : c.id)}>
              <span className="ts-fila-rank">{rank}</span>
              <div className="ts-fila-candidato-main">
                <div style={{ width: 38, height: 38, borderRadius: 10, background: "var(--ts-primary-soft)", color: "var(--ts-primary)", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 15, flexShrink: 0 }}>{c.nombre.charAt(0)}</div>
                <div style={{ minWidth: 0 }}>
                  <div className="ts-fila-nombre">{c.nombre}</div>
                  <div className="ts-fila-sub">{c.archivo}</div>
                </div>
              </div>
              <CompatRing value={c.compatibilidad} estado={c.estado} />
              <div className="ts-fila-estado">
                {cfg && <span className="ts-fila-estado-dot" style={{ backgroundColor: cfg.color }} />}
                <span style={{ color: cfg ? cfg.color : "inherit" }}>{cfg ? cfg.label : "—"}</span>
              </div>
              <span className="ts-muted-sm">{c.experienciaAnios !== null && c.experienciaAnios !== undefined ? `${c.experienciaAnios}a` : "—"}</span>
              <Icon name={abierto ? "chevrondown" : "chevronright"} size={16} style={{ color: "var(--ts-muted)", justifySelf: "end" }} />
            </button>
            {abierto && <DetalleContenido candidato={c} vacante={vacante} />}
          </React.Fragment>
        );
      })}

      {visibles.length === 0 && <div className="ts-card" style={{ textAlign: "center", color: "var(--ts-muted)" }}>No hay candidatos que coincidan.</div>}

      {totalPaginas > 1 && (
        <div className="ts-paginacion">
          <span className="ts-muted-sm">Mostrando {(paginaSegura - 1) * PAGE_SIZE + 1}–{Math.min(paginaSegura * PAGE_SIZE, filtrados.length)} de {filtrados.length}</span>
          <div className="ts-paginacion-botones">
            <button className="ts-pagina-btn" onClick={() => setPagina((p) => Math.max(1, p - 1))} disabled={paginaSegura === 1}><Icon name="arrowleft" size={13} /></button>
            {Array.from({ length: totalPaginas }, (_, i) => i + 1).map((p) => (
              <button key={p} className={`ts-pagina-btn ${p === paginaSegura ? "is-active" : ""}`} onClick={() => setPagina(p)}>{p}</button>
            ))}
            <button className="ts-pagina-btn" onClick={() => setPagina((p) => Math.min(totalPaginas, p + 1))} disabled={paginaSegura === totalPaginas}><Icon name="arrowright" size={13} /></button>
          </div>
        </div>
      )}

      <div className="ts-actions-left"><button className="ts-btn ts-btn--ghost" onClick={onBack}><Icon name="arrowleft" size={16} /> Volver</button></div>
    </div>
  );
}

/* ----------------------------------------------------------------------- */
/* APP PRINCIPAL                                                           */
/* ----------------------------------------------------------------------- */

function TalentScan() {
  const [step, setStep] = useState(1);
  const [vacantes, setVacantes] = useState(VACANTES_INICIALES);
  const [vacanteActivaId, setVacanteActivaId] = useState("editor_web");
  const [datosEstado, setDatosEstado] = useState("cargando");
  const [metaDatos, setMetaDatos] = useState(null);
  const [files, setFiles] = useState([]);
  const [candidatos, setCandidatos] = useState([]);
  const [vacanteEvaluada, setVacanteEvaluada] = useState(null);
  const [isAnalyzing, setIsAnalyzing] = useState(false);
  const [progress, setProgress] = useState(0);
  const pdfStatus = usePdfJs();

  useEffect(() => {
    fetch(`./vacantes.json?v=${Date.now()}`, { cache: "no-store" })
      .then((r) => (r.ok ? r.json() : Promise.reject()))
      .then((data) => {
        const { _meta, ...soloVacantes } = data || {};
        if (soloVacantes && Object.keys(soloVacantes).length) {
          setVacantes(soloVacantes);
          setVacanteActivaId(Object.keys(soloVacantes)[0]);
        }
        if (_meta) { setMetaDatos(_meta); setDatosEstado("listo"); }
        else setDatosEstado("sin_meta");
      })
      .catch(() => setDatosEstado("error"));
  }, []);

  const vacanteActiva = vacantes[vacanteActivaId];

  const analizar = async () => {
    setIsAnalyzing(true);
    setProgress(0);
    const resultados = [];
    const vacanteUsada = vacanteActiva;

    for (let i = 0; i < files.length; i++) {
      const f = files[i];
      try {
        const texto = await extraerTextoPDF(f);
        resultados.push(analizarCandidatoPorCoincidencias({ textoOriginal: texto, fileName: f.name, vacante: vacanteUsada }));
      } catch (e) {
        resultados.push(analizarCandidatoPorCoincidencias({ textoOriginal: "", fileName: f.name, vacante: vacanteUsada }));
      }
      setProgress(Math.round(((i + 1) / files.length) * 100));
    }

    setCandidatos(resultados);
    setVacanteEvaluada(vacanteUsada);
    setIsAnalyzing(false);
    setStep(2);
  };

  const reiniciar = () => { setFiles([]); setCandidatos([]); setStep(1); };

  return (
    <div className="ts-root">
      <div className="ts-shell">
        <div className="ts-brand-row">
          <div className="ts-brand">
            <div className="ts-brand-icon"><Icon name="scan" size={24} /></div>
            <div>
              <div className="ts-brand-name">Talent Scan <span className="ts-brand-org">REFORMA</span></div>
              <span className="ts-version-badge">v{VERSION}</span>
            </div>
          </div>
          <a className="ts-link-solicitar" href="./vacantes-editor.html" target="_blank" rel="noopener"><Icon name="pencil" size={14} /> Solicitar vacante nueva o cambios</a>
        </div>

        <div className="ts-datos-linea">
          {datosEstado === "cargando" && <><Icon name="loader" size={13} style={{ animation: "tsSpin 0.9s linear infinite" }} /> Cargando datos de vacantes…</>}
          {datosEstado === "listo" && <><Icon name="check" size={13} style={{ color: "#15803D" }} /> Datos v{metaDatos.version || "?"} · actualizados el {fechaAmigable(metaDatos.actualizado)}</>}
          {datosEstado === "sin_meta" && <><Icon name="alert" size={13} style={{ color: "#FF9500" }} /> vacantes.json cargó, pero no trae fecha de actualización registrada.</>}
          {datosEstado === "error" && <><Icon name="alert" size={13} style={{ color: "#FF9500" }} /> No se pudo cargar vacantes.json; usando los valores integrados en la página.</>}
        </div>

        <Stepper step={step} />

        {step === 1 && (
          <PasoPrincipal vacantes={vacantes} vacanteActivaId={vacanteActivaId} setVacanteActivaId={setVacanteActivaId} files={files} setFiles={setFiles} onAnalyze={analizar} isAnalyzing={isAnalyzing} progress={progress} pdfStatus={pdfStatus} />
        )}
        {step === 2 && <PasoResultados vacante={vacanteEvaluada} candidatos={candidatos} onBack={() => setStep(1)} onReiniciar={reiniciar} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<TalentScan />);
</script>
</body>
</html>
